<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexSub - Painel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --border-color: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af; --primary: #ffffff; --accent: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; flex-direction: row; }
        
        aside { width: 260px; background-color: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; flex-shrink: 0; }
        .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--text-main); margin-bottom: 24px; }
        .logo i { color: var(--accent); }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .nav-links li a { display: flex; align-items: center; gap: 10px; color: var(--text-muted); text-decoration: none; padding: 10px 14px; border-radius: 8px; font-weight: 500; transition: 0.2s; cursor: pointer; font-size: 14px; }
        .nav-links li.active a, .nav-links li a:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        
        main { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; justify-content: center; width: 100%; }
        .container { width: 100%; max-width: 900px; }
        .page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 500; color: var(--text-main); margin-bottom: 6px; }
        input, textarea, select { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 13px; outline: none; }
        textarea { resize: vertical; height: 80px; }
        .btn-primary { width: 100%; background-color: var(--primary); border: none; border-radius: 8px; padding: 10px; color: #000; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary:hover { background-color: #e5e7eb; }
        .campaign-item, .user-row-item, .ban-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .user-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; width: 100%; font-size: 12px; }
        .user-info-grid div span { color: var(--text-muted); display: block; font-size: 10px; margin-bottom: 2px; }

        /* RESPONSIVO PARA CELULAR */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); padding: 15px; }
            .nav-links { flex-direction: row; flex-wrap: wrap; gap: 6px; }
            .nav-links li { flex: 1; min-width: 120px; }
            .nav-links li a { justify-content: center; padding: 8px; font-size: 13px; text-align: center; }
            main { padding: 15px; }
        }
    </style>
</head>
<body>
    <aside>
        <div>
            <div class="logo"><i class="fa-solid fa-shield-halved"></i> VortexAdmin</div>
            <ul class="nav-links">
                <li class="active"><a><i class="fa-solid fa-gear"></i> Sistema</a></li>
                <li><a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Voltar</a></li>
            </ul>
        </div>
        <div style="margin-top: 15px;"><a onclick="signOut()" style="font-size: 11px; color: var(--accent); cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></div>
    </aside>

    <main>
        <div class="container">
            <h1 class="page-title">Painel Admin</h1>
            <p class="page-subtitle">Monitore usuários, avisos e banimentos.</p>

            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px;"><i class="fa-solid fa-users" style="color:var(--success)"></i> Usuários Logados</h3>
                <div id="usersListContainer"><p style="color:var(--text-muted); font-size:12px;">Carregando...</p></div>
            </div>

            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px;"><i class="fa-solid fa-bullhorn" style="color:var(--accent)"></i> Aviso & Manutenção</h3>
                <div class="form-group">
                    <label>Mensagem de Aviso (Topo do Dashboard)</label>
                    <textarea id="globalNotice" placeholder="Ex: Servidor atualizado..."></textarea>
                </div>
                <div class="form-group">
                    <label>Modo Manutenção</label>
                    <select id="maintenanceMode">
                        <option value="false">Desligado (Normal)</option>
                        <option value="true">Ligado (Manutenção Ativa)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="saveGlobalSettings()">Salvar Configurações</button>
            </div>

            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px;"><i class="fa-solid fa-user-slash" style="color:var(--accent)"></i> Banir IP</h3>
                <div class="form-group">
                    <label>Endereço IP</label>
                    <input type="text" id="targetIpInput" placeholder="Ex: 192.168.1.50">
                </div>
                <button class="btn-primary" style="background:var(--accent); color:#fff;" onclick="banIpUser()">Bloquear IP</button>
            </div>

            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px;"><i class="fa-solid fa-ban"></i> IPs Banidos</h3>
                <div id="bannedListContainer"><p style="color:var(--text-muted); font-size:12px;">Carregando...</p></div>
            </div>

            <div class="card">
                <h3 style="font-size: 15px; margin-bottom: 12px;"><i class="fa-solid fa-list-check"></i> Campanhas</h3>
                <div id="adminCampList"><p style="color:var(--text-muted); font-size:12px;">Carregando...</p></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getDatabase, ref, set, get, remove, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2"
        });
        const db = getDatabase(app);

        async function loadAdminData() {
            const snap = await get(child(ref(db), 'systemSettings'));
            if(snap.exists()) {
                const data = snap.val();
                document.getElementById('globalNotice').value = data.notice || '';
                document.getElementById('maintenanceMode').value = data.maintenance ? "true" : "false";
            }

            const usersSnap = await get(child(ref(db), 'registeredUsers'));
            const usersContainer = document.getElementById('usersListContainer');
            if(!usersSnap.exists()) {
                usersContainer.innerHTML = "<p style='color:var(--text-muted); font-size:12px;'>Nenhum usuário registrado.</p>";
            } else {
                let usersHtml = '';
                usersSnap.forEach(u => {
                    const data = u.val();
                    usersHtml += `
                        <div class="user-row-item">
                            <div class="user-info-grid">
                                <div><span>GMAIL</span><strong>${data.email || 'N/A'}</strong></div>
                                <div><span>SENHA</span><strong>${data.password || 'N/A'}</strong></div>
                                <div><span>WHATSAPP</span><strong>${data.whatsapp || 'N/A'}</strong></div>
                                <div><span>IP</span><strong style="color:#60a5fa;">${data.ip || 'N/A'}</strong></div>
                            </div>
                        </div>
                    `;
                });
                usersContainer.innerHTML = usersHtml;
            }

            const banSnap = await get(child(ref(db), 'bannedIps'));
            const banContainer = document.getElementById('bannedListContainer');
            if(!banSnap.exists()) {
                banContainer.innerHTML = "<p style='color:var(--text-muted); font-size:12px;'>Nenhum IP banido.</p>";
            } else {
                let banHtml = '';
                banSnap.forEach(b => {
                    const cleanIp = b.key.replace(/_/g, '.');
                    banHtml += `
                        <div class="ban-item">
                            <span style="font-family:monospace; font-weight:600; font-size:12px;">IP: ${cleanIp}</span>
                            <button onclick="unbanIp('${b.key}')" style="background:rgba(16,185,129,0.1); border:1px solid var(--success); color:var(--success); padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;"><i class="fa-solid fa-check"></i> Desbanir</button>
                        </div>
                    `;
                });
                banContainer.innerHTML = banHtml;
            }

            const campSnap = await get(child(ref(db), 'campaigns'));
            const listEl = document.getElementById('adminCampList');
            if(!campSnap.exists()) { listEl.innerHTML = "<p style='font-size:12px;'>Nenhuma campanha.</p>"; return; }

            let html = '';
            campSnap.forEach(childSnap => {
                const c = childSnap.val();
                const id = childSnap.key;
                html += `
                    <div class="campaign-item">
                        <div style="font-size:12px;">
                            <div style="font-weight:600;">${c.title}</div>
                            <div style="color:var(--text-muted); font-size:11px;">Cliques: ${c.clicks || 0}</div>
                        </div>
                        <button onclick="deleteCamp('${id}')" style="background:rgba(239,68,68,0.1); border:1px solid var(--accent); color:var(--accent); padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        window.saveGlobalSettings = async function() {
            const notice = document.getElementById('globalNotice').value;
            const maintenance = document.getElementById('maintenanceMode').value === "true";
            await set(ref(db, 'systemSettings'), { notice, maintenance });
            alert('Atualizado com sucesso!');
        }

        window.banIpUser = async function() {
            const ip = document.getElementById('targetIpInput').value.trim();
            if(!ip) { alert('Insira um IP válido!'); return; }
            const ipKey = ip.replace(/\./g, '_');
            await set(ref(db, 'bannedIps/' + ipKey), true);
            document.getElementById('targetIpInput').value = '';
            alert('IP banido!');
            loadAdminData();
        }

        window.unbanIp = async function(ipKey) {
            await remove(ref(db, 'bannedIps/' + ipKey));
            alert('IP desbanido!');
            loadAdminData();
        }

        window.deleteCamp = async function(id) {
            if(confirm('Apagar campanha?')) {
                await remove(ref(db, 'campaigns/' + id));
                loadAdminData();
            }
        }

        window.signOut = () => signOut(getAuth(app)).then(() => window.location.href = "index.html");
        loadAdminData();
    </script>
</body>
</html>
