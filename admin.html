<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Painel Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121216;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #1a0f0f 0%, #09090b 60%);
        }

        /* Sidebar / Painel Lateral */
        .sidebar {
            width: 280px;
            background: var(--panel-bg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(239, 68, 68, 0.15);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand span {
            color: var(--accent);
        }

        .admin-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--accent);
            color: #fca5a5;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-info {
            margin-top: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            word-break: break-all;
        }

        .user-info span strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 5px;
        }

        .btn-logout {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }

        .btn-logout:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .panel {
            background: var(--panel-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.1), 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(239, 68, 68, 0.05);
        }

        .admin-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            word-break: break-all;
        }

        .admin-card:hover {
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.08);
        }

        .admin-info h3 {
            margin: 0 0 5px 0;
            color: var(--text-main);
            font-size: 16px;
        }

        .admin-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 15px 20px;
                border-right: none;
                border-bottom: 1px solid rgba(239, 68, 68, 0.2);
                box-sizing: border-box;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            }
            
            .brand {
                margin-bottom: 0;
                font-size: 20px;
            }

            .admin-badge {
                display: none;
            }
            
            .user-info {
                margin-top: 0;
                padding: 0;
                background: none;
                border: none;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            
            #userEmailDisplay {
                display: none;
            }
            
            .btn-logout {
                margin-top: 0;
                padding: 7px 14px;
                width: auto;
                font-size: 12px;
            }
            
            .main-content {
                padding: 20px 15px;
            }
            
            .panel {
                padding: 20px 15px;
            }

            .admin-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .admin-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .admin-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">VORTEX<span>.</span></div>
        <div class="admin-badge"><i class="fa-solid fa-shield-halved"></i> Painel Admin</div>
        
        <div class="user-info">
            <span id="userEmailDisplay"><strong>Admin</strong>Carregando...</span>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Sair</button>
        </div>
    </div>

    <div class="main-content">
        <div class="panel">
            <h2 style="margin-top: 0; font-size: 18px; margin-bottom: 20px; letter-spacing: 0.5px;">Gerenciamento Geral do Sistema</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Área restrita para controle global de campanhas e registros do banco de dados.</p>
            
            <div id="adminContainer">
                <p style="color:var(--text-muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin"></i> Verificando permissões...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, child, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // COLOQUE O SEU E-MAIL DE ADMINISTRADOR ABAIXO ENTRE AS ASPAS:
        const ADMIN_EMAIL = "ffvortex20@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // TRAVA DE SEGURANÇA: Se o e-mail logado não for o seu, manda direto para o dashboard comum!
                if (user.email !== ADMIN_EMAIL) {
                    alert("Acesso negado! Apenas o administrador pode acessar esta página.");
                    window.location.href = 'dashboard.html';
                    return;
                }

                document.getElementById('userEmailDisplay').innerHTML = `<strong>Admin</strong>${user.email}`;
                loadAllSystemData();
            } else {
                window.location.href = 'index.html';
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        }

        async function loadAllSystemData() {
            const container = document.getElementById('adminContainer');
            container.innerHTML = `<p style="color:var(--text-muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin"></i> Buscando registros do sistema...</p>`;
            
            const snap = await get(child(ref(db), 'campaigns'));
            let html = '';
            
            if(snap.exists()) {
                snap.forEach(childSnap => {
                    const id = childSnap.key;
                    const camp = childSnap.val();
                    
                    html += `
                        <div class="admin-card">
                            <div class="admin-info">
                                <h3>${camp.title || 'Sem Título'}</h3>
                                <p><strong>Dono ID:</strong> ${camp.userId}</p>
                                <p><strong>Link:</strong> ${camp.shortUrl || 'N/A'}</p>
                            </div>
                            <div class="admin-actions">
                                <button class="btn-secondary" onclick="deleteGlobalCampaign('${id}')" style="border-color:rgba(239,68,68,0.4); color:#fca5a5;" title="Excluir Campanha"><i class="fa-solid fa-trash"></i> Excluir</button>
                            </div>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html || `<p style="color:var(--text-muted); font-size:14px;">Nenhuma campanha registrada no sistema.</p>`;
        }

        window.deleteGlobalCampaign = async function(id) {
            if(confirm('Tem certeza que deseja apagar esta campanha do sistema como Administrador?')) {
                await remove(ref(db, 'campaigns/' + id));
                loadAllSystemData();
            }
        }
    </script>
</body>
</html>
