<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexSub - Painel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --border-color: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af; --primary: #ffffff; --accent: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }
        aside { width: 260px; background-color: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
        .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--text-main); margin-bottom: 32px; }
        .logo i { color: var(--accent); }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-links li a { display: flex; align-items: center; gap: 12px; color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 8px; font-weight: 500; transition: 0.2s; cursor: pointer; }
        .nav-links li.active a, .nav-links li a:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        main { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 8px; }
        input, textarea { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 14px; outline: none; }
        textarea { resize: vertical; height: 90px; }
        .btn-primary { width: 100%; background-color: var(--primary); border: none; border-radius: 8px; padding: 12px; color: #000; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background-color: #e5e7eb; }
        .campaign-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <aside>
        <div>
            <div class="logo"><i class="fa-solid fa-shield-halved"></i> VortexAdmin</div>
            <ul class="nav-links">
                <li class="active"><a><i class="fa-solid fa-gear"></i> Configurações & Avisos</a></li>
                <li><a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a></li>
            </ul>
        </div>
        <div><a onclick="signOut()" style="font-size: 11px; color: var(--accent); cursor:pointer;">Sair</a></div>
    </aside>

    <main>
        <div class="container">
            <h1 class="page-title">Painel de Administração Global</h1>
            <p class="page-subtitle">Envie avisos, configure manutenções e controle o sistema.</p>

            <div class="card">
                <h3 style="font-size: 16px; margin-bottom: 16px;"><i class="fa-solid fa-bullhorn" style="color:var(--accent)"></i> Aviso Geral & Manutenção</h3>
                <div class="form-group">
                    <label>Mensagem de Aviso / Alerta para o Dashboard</label>
                    <textarea id="globalNotice" placeholder="Ex: Sistema em atualização às 18h..."></textarea>
                </div>
                <div class="form-group">
                    <label>Modo Manutenção Global</label>
                    <select id="maintenanceMode" style="width:100%; background:var(--bg-color); border:1px solid var(--border-color); border-radius:8px; padding:12px; color:var(--text-main)">
                        <option value="false">Desligado (Normal)</option>
                        <option value="true">Ligado (Bloquear Usuários)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="saveGlobalSettings()">Salvar Alterações</button>
            </div>

            <div class="card">
                <h3 style="font-size: 16px; margin-bottom: 16px;"><i class="fa-solid fa-list-check"></i> Todas as Campanhas do Sistema</h3>
                <div id="adminCampList"><p style="color:var(--text-muted); font-size:13px;">Carregando...</p></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getDatabase, ref, set, get, remove, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2"
        });
        const db = getDatabase(app);

        async function loadAdminData() {
            const snap = await get(child(ref(db), 'systemSettings'));
            if(snap.exists()) {
                const data = snap.val();
                document.getElementById('globalNotice').value = data.notice || '';
                document.getElementById('maintenanceMode').value = data.maintenance ? "true" : "false";
            }

            const campSnap = await get(child(ref(db), 'campaigns'));
            const listEl = document.getElementById('adminCampList');
            if(!campSnap.exists()) { listEl.innerHTML = "<p>Nenhuma campanha.</p>"; return; }

            let html = '';
            campSnap.forEach(childSnap => {
                const c = childSnap.val();
                const id = childSnap.key;
                html += `
                    <div class="campaign-item">
                        <div>
                            <div style="font-weight:600; font-size:14px;">${c.title} <span style="font-size:11px; color:var(--text-muted)">(${c.creator})</span></div>
                            <div style="font-size:12px; color:var(--text-muted)">Cliques: ${c.clicks || 0}</div>
                        </div>
                        <button onclick="deleteCamp('${id}')" style="background:rgba(239,68,68,0.1); border:1px solid var(--accent); color:var(--accent); padding:6px 10px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        window.saveGlobalSettings = async function() {
            const notice = document.getElementById('globalNotice').value;
            const maintenance = document.getElementById('maintenanceMode').value === "true";
            await set(ref(db, 'systemSettings'), { notice, maintenance });
            alert('Configurações globais salvas e sincronizadas!');
        }

        window.deleteCamp = async function(id) {
            if(confirm('Apagar campanha do sistema?')) {
                await remove(ref(db, 'campaigns/' + id));
                loadAdminData();
            }
        }

        window.signOut = () => signOut(getAuth(app)).then(() => window.location.href = "index.html");
        loadAdminData();
    </script>
</body>
</html>
