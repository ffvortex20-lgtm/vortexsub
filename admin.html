<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Hub - Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            background-image: 
                linear-gradient(to right, rgba(30, 41, 59, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans p-4 sm:p-6">
    <div class="max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800/80 pb-4">
            <h1 class="text-xl font-black tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-indigo-400"></i> PAINEL ADMIN
            </h1>
            <a href="liberar.html" class="text-xs font-bold bg-slate-900 border border-slate-800 hover:border-indigo-500 px-4 py-2 rounded-xl transition text-slate-300">Ver Páginas</a>
        </header>

        <!-- Formulário de Criação/Edição -->
        <div class="bg-slate-900/90 border-2 border-indigo-500/40 p-6 rounded-3xl shadow-[0_0_30px_rgba(99,102,241,0.15)] mb-8 backdrop-blur-md">
            <h2 id="formTitle" class="text-base font-bold mb-4 text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Criar Nova Página Personalizada
            </h2>
            <input type="hidden" id="editKey">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Identificador (Slug) *Obrigatório</label>
                    <input type="text" id="slug" placeholder="ex: 07cabelinn" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Título Exibido no Topo *Opcional</label>
                    <input type="text" id="pageTitle" placeholder="ex: 07cabelinn" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Foto do Perfil (Avatar) *Opcional</label>
                    <input type="file" id="inputAvatar" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                    <input type="hidden" id="avatarBase64">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Link de Download *Opcional</label>
                    <input type="url" id="linkDownload" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Link de Tutorial *Opcional</label>
                    <input type="url" id="linkTutorial" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Seção de Links Dinâmicos / Redes Inferiores -->
            <div class="border-t border-slate-800 pt-4 mb-6">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-xs font-bold uppercase tracking-wider text-indigo-300"><i class="fa-solid fa-link"></i> Links e Ícones Inferiores (Adicione quantos quiser)</label>
                    <button type="button" onclick="adicionarCampoLink()" class="bg-indigo-600/20 border border-indigo-500/40 text-indigo-400 hover:bg-indigo-600 hover:text-white text-xs font-bold px-3 py-1.5 rounded-xl transition">+ Adicionar Link</button>
                </div>
                <div id="containerLinksDinamicos" class="space-y-3">
                    <!-- Campos adicionados via JS -->
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="salvarPagina()" class="bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-black text-xs uppercase px-6 py-3 rounded-xl transition shadow-lg">Salvar Página</button>
                <button onclick="limparForm()" class="bg-slate-950 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-bold px-4 py-3 rounded-xl transition">Cancelar</button>
            </div>
        </div>

        <!-- Lista de Páginas -->
        <div class="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-xl backdrop-blur-md">
            <h2 class="text-base font-bold mb-4 text-slate-200">Páginas Gerenciadas</h2>
            <div id="listaPaginas" class="space-y-3"></div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, remove, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:android:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Converter foto para Base64 para salvar no Realtime Database sem erros
        document.getElementById('inputAvatar').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    document.getElementById('avatarBase64').value = uploadEvent.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.adicionarCampoLink = function(nome = '', url = '', iconeBase64 = '') {
            const container = document.getElementById('containerLinksDinamicos');
            const div = document.createElement('div');
            div.className = "flex items-center gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-800 item-link-dinamico";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center overflow-hidden shrink-0">
                    ${iconeBase64 ? `<img src="${iconeBase64}" class="w-full h-full object-cover preview-icone">` : `<i class="fa-solid fa-image text-slate-500 text-xs"></i>`}
                </div>
                <input type="file" accept="image/*" class="input-icone-file hidden" onchange="processarIcone(this)">
                <button type="button" onclick="this.previousElementSibling.click()" class="bg-slate-900 border border-slate-800 hover:border-indigo-500 text-slate-300 text-xs px-3 py-2 rounded-xl transition shrink-0">Ícone</button>
                <input type="text" placeholder="Nome (ex: ZAP GRUPO)" value="${nome}" class="input-nome-link w-1/3 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                <input type="url" placeholder="URL do Link" value="${url}" class="input-url-link flex-grow bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                <input type="hidden" class="input-base64-icone" value="${iconeBase64}">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 px-2 py-1 text-xs shrink-0"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        window.processarIcone = function(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const parent = input.parentElement;
                    parent.querySelector('.input-base64-icone').value = e.target.result;
                    parent.querySelector('.w-10').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        }

        window.salvarPagina = async function() {
            const slug = document.getElementById("slug").value.trim().toLowerCase().replace(/\s+/g, '-');
            const title = document.getElementById("pageTitle").value;
            const download = document.getElementById("linkDownload").value;
            const tutorial = document.getElementById("linkTutorial").value;
            const avatar = document.getElementById("avatarBase64").value;

            if(!slug) {
                alert("Preencha o identificador (slug)!");
                return;
            }

            // Coletar links dinâmicos
            const linksDinamicos = [];
            document.querySelectorAll('.item-link-dinamico').forEach(item => {
                const nome = item.querySelector('.input-nome-link').value;
                const url = item.querySelector('.input-url-link').value;
                const icone = item.querySelector('.input-base64-icone').value;
                if(nome && url) {
                    linksDinamicos.push({ nome, url, icone });
                }
            });

            try {
                await set(ref(db, 'paginas/' + slug), {
                    slug, title, download, tutorial, avatar, links: linksDinamicos
                });
                alert("Página salva com sucesso!");
                limparForm();
                carregarPaginas();
            } catch (error) {
                console.error(error);
                alert("Erro ao salvar.");
            }
        }

        window.carregarPaginas = async function() {
            const container = document.getElementById("listaPaginas");
            container.innerHTML = "<p class='text-slate-500 text-xs'>Carregando...</p>";
            
            const dbRef = ref(db);
            try {
                const snapshot = await get(child(dbRef, 'paginas'));
                if (snapshot.exists()) {
                    container.innerHTML = "";
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        container.innerHTML += `
                            <div class="flex items-center justify-between bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                <div>
                                    <h3 class="font-bold text-slate-100 text-sm">${data.title || data.slug}</h3>
                                    <a href="liberar.html?p=${data.slug}" target="_blank" class="text-indigo-400 text-xs hover:underline">liberar.html?p=${data.slug}</a>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick='editarPagina(${JSON.stringify(data)})' class="bg-slate-900 border border-slate-800 hover:border-indigo-500 px-3 py-1.5 rounded-xl text-xs transition"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick='deletarPagina("${data.slug}")' class="bg-red-950/40 border border-red-900/50 hover:bg-red-900 text-red-400 px-3 py-1.5 rounded-xl text-xs transition"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = "<p class='text-slate-500 text-xs'>Nenhuma página cadastrada.</p>";
                }
            } catch (error) { console.error(error); }
        }

        window.editarPagina = function(data) {
            document.getElementById("slug").value = data.slug;
            document.getElementById("slug").disabled = true;
            document.getElementById("pageTitle").value = data.title || "";
            document.getElementById("linkDownload").value = data.download || "";
            document.getElementById("linkTutorial").value = data.tutorial || "";
            document.getElementById("avatarBase64").value = data.avatar || "";
            
            document.getElementById("containerLinksDinamicos").innerHTML = "";
            if(data.links && Array.isArray(data.links)) {
                data.links.forEach(l => adicionarCampoLink(l.nome, l.url, l.icone));
            }
            document.getElementById("formTitle").innerText = "Editando Página: " + data.slug;
        }

        window.limparForm = function() {
            document.getElementById("slug").value = "";
            document.getElementById("slug").disabled = false;
            document.getElementById("pageTitle").value = "";
            document.getElementById("linkDownload").value = "";
            document.getElementById("linkTutorial").value = "";
            document.getElementById("avatarBase64").value = "";
            document.getElementById("inputAvatar").value = "";
            document.getElementById("containerLinksDinamicos").innerHTML = "";
            document.getElementById("formTitle").innerHTML = "<i class='fa-solid fa-plus-circle'></i> Criar Nova Página Personalizada";
        }

        window.deletarPagina = async function(slug) {
            if(confirm("Deseja realmente apagar esta página?")) {
                await remove(ref(db, 'paginas/' + slug));
                carregarPaginas();
            }
        }

        carregarPaginas();
    </script>
</body>
</html>
