<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar/Header */
        .sidebar {
            width: 260px;
            background: var(--panel-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        .user-info {
            margin-top: auto;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 14px;
            word-break: break-all;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: white;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .panel {
            display: none;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.4s ease;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Formulários e Inputs */
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-main);
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .task-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .task-row .form-control {
            margin-bottom: 0;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Cards de Campanha */
        .campaign-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .campaign-card:hover {
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.1);
        }

        .campaign-info h3 {
            margin: 0 0 5px 0;
            color: var(--text-main);
        }

        .campaign-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .campaign-actions {
            display: flex;
            gap: 10px;
        }

        .campaign-actions .btn-secondary {
            padding: 10px 15px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">VORTEX</div>
        
        <div class="user-info">
            <span id="userEmailDisplay">Carregando...</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </div>

    <div class="main-content">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('list')">Minhas Campanhas</button>
            <button class="tab-btn" id="tabCreateBtn" onclick="switchTab('create')">Criar Nova</button>
        </div>

        <!-- Painel de Lista -->
        <div id="listPanel" class="panel active">
            <h2 style="margin-top: 0;">Campanhas Ativas</h2>
            <div id="campaignsContainer">
                <p style="color:var(--text-muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin"></i> Carregando suas campanhas...</p>
            </div>
        </div>

        <!-- Painel de Criação/Edição -->
        <div id="createPanel" class="panel">
            <h2 id="formTitleAction" style="margin-top: 0;">Criar Campanha</h2>
            <form id="campaignForm" onsubmit="saveCampaign(event)">
                <input type="hidden" id="editCampaignId">
                
                <input type="text" id="campTitle" class="form-control" placeholder="Nome da Campanha (Ex: Vídeo Novo)" required>
                <input type="url" id="targetUrl" class="form-control" placeholder="URL de Destino Final (Para onde o usuário vai no fim)" required>
                
                <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 16px;">Passos/Tarefas Obrigatórias</h3>
                <div id="tasksContainer">
                    <!-- As tarefas entram aqui via JS -->
                </div>
                
                <button type="button" class="btn-secondary" onclick="addTaskField()" style="margin-bottom: 25px; width: 100%; border-style: dashed;">
                    <i class="fa-solid fa-plus"></i> Adicionar Tarefa
                </button>

                <button type="submit" class="btn-primary" style="width: 100%;">Salvar Campanha</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT DO FIREBASE (CORRIGIDO) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, set, get, child, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;

        // Verifica o Login e Carrega os dados
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadUserCampaigns();
            } else {
                window.location.href = 'index.html'; // Manda pro login se não estiver logado
            }
        });

        // Função de Sair
        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        }

        // Sistema de Abas
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if(tab === 'list') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('listPanel').classList.add('active');
                document.getElementById('editCampaignId').value = '';
                document.getElementById('campaignForm').reset();
                document.getElementById('formTitleAction').innerText = 'Criar Campanha';
                document.getElementById('tasksContainer').innerHTML = '';
            } else {
                document.getElementById('tabCreateBtn').classList.add('active');
                document.getElementById('createPanel').classList.add('active');
                if(document.getElementById('tasksContainer').children.length === 0) {
                    addTaskField();
                }
            }
        }

        // Adicionar Tarefa
        window.addTaskField = function(type = 'youtube', url = '') {
            const container = document.getElementById('tasksContainer');
            const div = document.createElement('div');
            div.className = 'task-row';
            div.innerHTML = `
                <select class="form-control" style="width: 150px; flex-shrink: 0;" name="taskType">
                    <option value="youtube" ${type==='youtube'?'selected':''}>YouTube</option>
                    <option value="whatsapp" ${type==='whatsapp'?'selected':''}>WhatsApp</option>
                    <option value="telegram" ${type==='telegram'?'selected':''}>Telegram</option>
                </select>
                <input type="url" class="form-control" placeholder="URL da tarefa" value="${url}" name="taskUrl" required>
                <button type="button" class="btn-secondary" onclick="this.parentElement.remove()" style="color:#ef4444; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.1); flex-shrink: 0;">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        // Salvar Campanha no Firebase
        window.saveCampaign = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editCampaignId').value;
            const title = document.getElementById('campTitle').value;
            const targetUrl = document.getElementById('targetUrl').value;
            
            const taskRows = document.querySelectorAll('.task-row');
            const tasks = [];
            taskRows.forEach(row => {
                tasks.push({
                    type: row.querySelector('[name="taskType"]').value,
                    url: row.querySelector('[name="taskUrl"]').value
                });
            });

            const campaignData = {
                userId: currentUser.uid,
                title,
                targetUrl,
                tasks,
                shortUrl: editId ? undefined : `https://vortexsub.pages.dev/s/?id=${Math.random().toString(36).substring(7)}`,
                updatedAt: Date.now()
            };

            if(editId) {
                delete campaignData.shortUrl; // Não altera a URL encurtada ao editar
                await update(ref(db, 'campaigns/' + editId), campaignData);
            } else {
                campaignData.createdAt = Date.now();
                const newRef = push(ref(db, 'campaigns'));
                await set(newRef, campaignData);
            }

            switchTab('list');
            loadUserCampaigns();
        }

        // Carregar Campanhas do Firebase
        async function loadUserCampaigns() {
            const container = document.getElementById('campaignsContainer');
            container.innerHTML = `<p style="color:var(--text-muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin"></i> Sincronizando dados...</p>`;
            
            const snap = await get(child(ref(db), 'campaigns'));
            let html = '';
            
            if(snap.exists()) {
                snap.forEach(childSnap => {
                    const id = childSnap.key;
                    const camp = childSnap.val();
                    
                    if(camp.userId === currentUser.uid) {
                        html += `
                            <div class="campaign-card">
                                <div class="campaign-info">
                                    <h3>${camp.title}</h3>
                                    <p>${camp.shortUrl || 'Link personalizado'}</p>
                                </div>
                                <div class="campaign-actions">
                                    <button class="btn-secondary" onclick="navigator.clipboard.writeText('${camp.shortUrl || ''}'); alert('Link copiado com sucesso!');" title="Copiar Link"><i class="fa-solid fa-copy"></i></button>
                                    <button class="btn-secondary" onclick="editCampaign('${id}')" style="background:rgba(59,130,246,0.1); border-color:#3b82f6; color:#3b82f6;" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn-secondary" onclick="deleteCampaign('${id}')" style="background:rgba(239,68,68,0.1); border-color:#ef4444; color:#ef4444;" title="Apagar"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }
                });
            }
            container.innerHTML = html || `<p style="color:var(--text-muted); font-size:14px;">Você ainda não tem nenhuma campanha criada.</p>`;
        }

        // Editar
        window.editCampaign = async function(id) {
            const snap = await get(child(ref(db), 'campaigns/' + id));
            if(!snap.exists()) return;
            const c = snap.val();

            document.getElementById('editCampaignId').value = id;
            document.getElementById('targetUrl').value = c.targetUrl;
            document.getElementById('campTitle').value = c.title;
            document.getElementById('formTitleAction').innerText = 'Editando: ' + c.title;

            const tasksContainer = document.getElementById('tasksContainer');
            tasksContainer.innerHTML = '';
            if(c.tasks && c.tasks.length > 0) {
                c.tasks.forEach(t => {
                    addTaskField(t.type, t.url);
                });
            } else {
                addTaskField();
            }

            switchTab('create');
        }

        // Excluir
        window.deleteCampaign = async function(id) {
            if(confirm('Tem certeza que deseja excluir esta campanha? Os links vão parar de funcionar.')) {
                await remove(ref(db, 'campaigns/' + id));
                loadUserCampaigns();
            }
        }
    </script>
</body>
</html>
