<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121216;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #1a0f0f 0%, #09090b 60%);
        }

        /* Sidebar / Painel Lateral */
        .sidebar {
            width: 280px;
            background: var(--panel-bg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(239, 68, 68, 0.15);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand span {
            color: var(--accent);
        }

        .user-info {
            margin-top: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            word-break: break-all;
        }

        .user-info span strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 5px;
        }

        .btn-logout {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }

        .btn-logout:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .panel {
            display: none;
            background: var(--panel-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.1), 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: fadeIn 0.3s ease;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Formulários e Inputs */
        .form-control {
            width: 100%;
            padding: 13px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        .task-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .task-row .form-control {
            margin-bottom: 0;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background: #dc2626;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Cards de Campanha */
        .campaign-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            word-break: break-all;
        }

        .campaign-card:hover {
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.08);
            transform: translateX(3px);
        }

        .campaign-info {
            flex: 1;
            padding-right: 15px;
        }

        .campaign-info h3 {
            margin: 0 0 5px 0;
            color: var(--text-main);
            font-size: 16px;
        }

        .campaign-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .campaign-actions {
            display: flex;
            gap: 8px;
        }

        .campaign-actions .btn-secondary {
            padding: 10px 14px;
        }

        /* RESPONSIVIDADE PARA CELULARES */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 15px 20px;
                border-right: none;
                border-bottom: 1px solid rgba(239, 68, 68, 0.2);
                box-sizing: border-box;
                box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            }
            
            .brand {
                margin-bottom: 0;
                font-size: 20px;
            }
            
            .user-info {
                margin-top: 0;
                padding: 0;
                background: none;
                border: none;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            
            #userEmailDisplay {
                display: none;
            }
            
            .btn-logout {
                margin-top: 0;
                padding: 7px 14px;
                width: auto;
                font-size: 12px;
            }
            
            .main-content {
                padding: 20px 15px;
            }
            
            .tabs {
                flex-direction: row;
                gap: 10px;
            }

            .tab-btn {
                padding: 10px;
                font-size: 13px;
            }
            
            .panel {
                padding: 20px 15px;
            }

            .task-row {
                flex-direction: column;
                background: rgba(0,0,0,0.25);
                padding: 12px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.05);
                margin-bottom: 12px;
            }
            
            .task-row select {
                width: 100% !important;
            }
            
            .task-row button {
                width: 100%;
            }

            .campaign-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .campaign-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .campaign-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">VORTEX<span>.</span></div>
        
        <div class="user-info">
            <span id="userEmailDisplay"><strong>Conectado</strong>Carregando...</span>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Sair</button>
        </div>
    </div>

    <div class="main-content">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('list')"><i class="fa-solid fa-layer-group"></i> Minhas Campanhas</button>
            <button class="tab-btn" id="tabCreateBtn" onclick="switchTab('create')"><i class="fa-solid fa-plus-circle"></i> Criar Nova</button>
        </div>

        <!-- Painel de Lista -->
        <div id="listPanel" class="panel active">
            <h2 style="margin-top: 0; font-size: 18px; margin-bottom: 20px; letter-spacing: 0.5px;">Campanhas Ativas</h2>
            <div id="campaignsContainer">
                <p style="color:var(--text-muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin"></i> Carregando suas campanhas...</p>
            </div>
        </div>

        <!-- Painel de Criação/Edição -->
        <div id="createPanel" class="panel">
            <h2 id="formTitleAction" style="margin-top: 0; font-size: 18px; margin-bottom: 20px; letter-spacing: 0.5px;">Criar Campanha</h2>
            <form id="campaignForm" onsubmit="saveCampaign(event)">
                <input type="hidden" id="editCampaignId">
                
                <input type="text" id="campTitle" class="form-control" placeholder="Nome da Campanha (Ex: Vídeo Novo)" required>
                <input type="url" id="targetUrl" class="form-control" placeholder="URL de Destino Final (Link bloqueado)" required>
                
                <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 15px; color: var(--text-main);">Passos/Tarefas Obrigatórias</h3>
                <div id="tasksContainer">
                    <!-- As tarefas entram aqui via JS -->
                </div>
                
                <button type="button" class="btn-secondary" onclick="addTaskField()" style="margin-bottom: 25px; width: 100%; border-style: dashed; border-color: rgba(239,68,68,0.3);">
                    <i class="fa-solid fa-plus" style="color: var(--accent);"></i> Adicionar Tarefa
                </button>

                <button type="submit" class="btn-primary">Salvar Campanha</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, set, get, child, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmailDisplay').innerHTML = `<strong>Conectado</strong>${user.email}`;
                loadUserCampaigns();
            } else {
                window.location.href = 'index.html';
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if(tab === 'list') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('listPanel').classList.add('active');
                document.getElementById('editCampaignId').value = '';
                document.getElementById('campaignForm').reset();
                document.getElementById('formTitleAction').innerText = 'Criar Campanha';
                document.getElementById('tasksContainer').innerHTML = '';
            } else {
                document.getElementById('tabCreateBtn').classList.add('active');
                document.getElementById('createPanel').classList.add('active');
                if(document.getElementById('tasksContainer').children.length === 0) {
                    addTaskField();
                }
            }
        }

        window.addTaskField = function(type = 'youtube', url = '') {
            const container = document.getElementById('tasksContainer');
            const div = document.createElement('div');
            div.className = 'task-row';
            div.innerHTML = `
                <select class="form-control" style="width: 150px; flex-shrink: 0;" name="taskType">
                    <option value="youtube" ${type==='youtube'?'selected':''}>YouTube</option>
                    <option value="whatsapp" ${type==='whatsapp'?'selected':''}>WhatsApp</option>
                    <option value="telegram" ${type==='telegram'?'selected':''}>Telegram</option>
                </select>
                <input type="url" class="form-control" placeholder="URL da tarefa (Ex: link do canal)" value="${url}" name="taskUrl" required>
                <button type="button" class="btn-secondary" onclick="this.parentElement.remove()" style="color:#fca5a5; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.05); flex-shrink: 0;" title="Remover">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        window.saveCampaign = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editCampaignId').value;
            const title = document.getElementById('campTitle').value;
            const targetUrl = document.getElementById('targetUrl').value;
            
            const taskRows = document.querySelectorAll('.task-row');
            const tasks = [];
            taskRows.forEach(row => {
                tasks.push({
                    type: row.querySelector('[name="taskType"]').value,
                    url: row.querySelector('[name="taskUrl"]').value
                });
            });

            // Gerador de ID Único e Link Personalizado com Hash Router
            const randomId = editId ? null : Math.random().toString(36).substring(2, 8);
            const generatedShortUrl = editId ? null : `https://www.vortexsub.shop/#/campaign/${randomId}`;

            const campaignData = {
                userId: currentUser.uid,
                title,
                targetUrl,
                tasks,
                updatedAt: Date.now()
            };

            if(editId) {
                await update(ref(db, 'campaigns/' + editId), campaignData);
            } else {
                campaignData.createdAt = Date.now();
                campaignData.shortUrl = generatedShortUrl;
                // Salvamos usando o mesmo randomId como a chave no banco de dados para facilitar a leitura no index.html
                await set(ref(db, 'campaigns/' + randomId), campaignData);
            }

            switchTab('list');
            loadUserCampaigns();
        }

        async function loadUserCampaigns() {
            const container = document.getElementById('campaignsContainer');
            container.innerHTML = `<p style="color:var(--text-muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin"></i> Sincronizando dados...</p>`;
            
            const snap = await get(child(ref(db), 'campaigns'));
            let html = '';
            
            if(snap.exists()) {
                snap.forEach(childSnap => {
                    const id = childSnap.key;
                    const camp = childSnap.val();
                    
                    if(camp.userId === currentUser.uid) {
                        const displayLink = camp.shortUrl || `https://www.vortexsub.shop/#/campaign/${id}`;
                        html += `
                            <div class="campaign-card">
                                <div class="campaign-info">
                                    <h3>${camp.title}</h3>
                                    <p>${displayLink}</p>
                                </div>
                                <div class="campaign-actions">
                                    <button class="btn-secondary" onclick="navigator.clipboard.writeText('${displayLink}'); alert('Link copiado com sucesso!');" title="Copiar Link"><i class="fa-solid fa-copy"></i></button>
                                    <button class="btn-secondary" onclick="editCampaign('${id}')" style="border-color:rgba(59,130,246,0.4); color:#60a5fa;" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn-secondary" onclick="deleteCampaign('${id}')" style="border-color:rgba(239,68,68,0.4); color:#fca5a5;" title="Apagar"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }
                });
            }
            container.innerHTML = html || `<p style="color:var(--text-muted); font-size:14px;">Você ainda não tem nenhuma campanha criada.</p>`;
        }

        window.editCampaign = async function(id) {
            const snap = await get(child(ref(db), 'campaigns/' + id));
            if(!snap.exists()) return;
            const c = snap.val();

            document.getElementById('editCampaignId').value = id;
            document.getElementById('targetUrl').value = c.targetUrl;
            document.getElementById('campTitle').value = c.title;
            document.getElementById('formTitleAction').innerText = 'Editando: ' + c.title;

            const tasksContainer = document.getElementById('tasksContainer');
            tasksContainer.innerHTML = '';
            if(c.tasks && c.tasks.length > 0) {
                c.tasks.forEach(t => {
                    addTaskField(t.type, t.url);
                });
            } else {
                addTaskField();
            }

            switchTab('create');
        }

        window.deleteCampaign = async function(id) {
            if(confirm('Tem certeza que deseja excluir esta campanha? Os links vão parar de funcionar.')) {
                await remove(ref(db, 'campaigns/' + id));
                loadUserCampaigns();
            }
        }
    </script>
</body>
</html>
