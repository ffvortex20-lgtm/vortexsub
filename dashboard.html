<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexSub - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: none;
        }

        .panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .campaign-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .campaign-info h3 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .campaign-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .campaign-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
        }

        .task-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            header {
                padding: 1rem;
            }
            .campaign-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .campaign-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-bolt"></i> VortexSub</h1>
        <div class="user-info">
            <span id="userEmailDisplay">Carregando...</span>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </div>
    </header>

    <main>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('list')">Minhas Campanhas</button>
            <button class="tab-btn" id="tabCreateBtn" onclick="switchTab('create')">Criar Campanha</button>
        </div>

        <!-- Painel de Listagem -->
        <div id="listPanel" class="panel active">
            <div id="campaignsContainer">
                <p style="color:var(--text-muted); font-size:12px;">Carregando campanhas...</p>
            </div>
        </div>

        <!-- Painel de Criação/Edição -->
        <div id="createPanel" class="panel">
            <h2 id="formTitleAction" style="font-size:1.1rem; margin-bottom:1.2rem;">Criar campanha</h2>
            <form id="campaignForm" onsubmit="saveCampaign(event)">
                <input type="hidden" id="editCampaignId">
                <div class="form-group">
                    <label>Título da Campanha</label>
                    <input type="text" id="campTitle" class="form-control" required placeholder="Ex: Meu Mod Menu">
                </div>
                <div class="form-group">
                    <label>Link de Destino (Final)</label>
                    <input type="url" id="targetUrl" class="form-control" required placeholder="https://exemplo.com/download">
                </div>
                <div class="form-group">
                    <label>Tarefas (Inscrições, Redes Sociais, etc.)</label>
                    <div id="tasksContainer"></div>
                    <button type="button" class="btn-secondary" style="margin-top:0.5rem;" onclick="addTaskField()"><i class="fa-solid fa-plus"></i> Adicionar Tarefa</button>
                </div>
                <button type="submit" class="btn-primary">Salvar Campanha</button>
            </form>
        </div>
    </main>

    <!-- Firebase SDKs e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, set, get, child, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Substitua com suas credenciais do Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            databaseURL: "SUA_DATABASE_URL",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadUserCampaigns();
            } else {
                window.location.href = 'index.html';
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if(tab === 'list') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('listPanel').classList.add('active');
                document.getElementById('editCampaignId').value = '';
                document.getElementById('campaignForm').reset();
                document.getElementById('formTitleAction').innerText = 'Criar campanha';
                document.getElementById('tasksContainer').innerHTML = '';
            } else {
                document.getElementById('tabCreateBtn').classList.add('active');
                document.getElementById('createPanel').classList.add('active');
                if(document.getElementById('tasksContainer').children.length === 0) {
                    addTaskField();
                }
            }
        }

        window.addTaskField = function(type = 'youtube', url = '') {
            const container = document.getElementById('tasksContainer');
            const div = document.createElement('div');
            div.className = 'task-row';
            div.innerHTML = `
                <select class="form-control" style="width: 130px;" name="taskType">
                    <option value="youtube" ${type==='youtube'?'selected':''}>YouTube</option>
                    <option value="whatsapp" ${type==='whatsapp'?'selected':''}>WhatsApp</option>
                    <option value="telegram" ${type==='telegram'?'selected':''}>Telegram</option>
                </select>
                <input type="url" class="form-control" placeholder="URL da tarefa" value="${url}" name="taskUrl" required>
                <button type="button" class="btn-secondary" onclick="this.parentElement.remove()" style="color:var(--accent); border-color:var(--accent);"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        window.saveCampaign = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editCampaignId').value;
            const title = document.getElementById('campTitle').value;
            const targetUrl = document.getElementById('targetUrl').value;
            
            const taskRows = document.querySelectorAll('.task-row');
            const tasks = [];
            taskRows.forEach(row => {
                tasks.push({
                    type: row.querySelector('[name="taskType"]').value,
                    url: row.querySelector('[name="taskUrl"]').value
                });
            });

            const campaignData = {
                userId: currentUser.uid,
                title,
                targetUrl,
                tasks,
                shortUrl: editId ? undefined : `https://vortexsub.pages.dev/s/?id=${Math.random().toString(36).substring(7)}`,
                updatedAt: Date.now()
            };

            if(editId) {
                delete campaignData.shortUrl; // Mantém o link curto original na edição
                await update(ref(db, 'campaigns/' + editId), campaignData);
            } else {
                campaignData.createdAt = Date.now();
                const newRef = push(ref(db, 'campaigns'));
                await set(newRef, campaignData);
            }

            switchTab('list');
            loadUserCampaigns();
        }

        async function loadUserCampaigns() {
            const container = document.getElementById('campaignsContainer');
            container.innerHTML = `<p style="color:var(--text-muted); font-size:12px;">Carregando campanhas...</p>`;
            
            const snap = await get(child(ref(db), 'campaigns'));
            let html = '';
            
            if(snap.exists()) {
                snap.forEach(childSnap => {
                    const id = childSnap.key;
                    const camp = childSnap.val();
                    
                    if(camp.userId === currentUser.uid) {
                        html += `
                            <div class="campaign-card">
                                <div class="campaign-info">
                                    <h3>${camp.title}</h3>
                                    <p>${camp.shortUrl || 'Link personalizado'}</p>
                                </div>
                                <div class="campaign-actions">
                                    <button class="btn-secondary" onclick="navigator.clipboard.writeText('${camp.shortUrl || ''}'); alert('Link copiado!');"><i class="fa-solid fa-copy"></i></button>
                                    <button class="btn-secondary" onclick="editCampaign('${id}')" style="background:rgba(59,130,246,0.1); border-color:#3b82f6; color:#3b82f6;"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn-secondary" onclick="deleteCampaign('${id}')" style="background:rgba(239,68,68,0.1); border-color:var(--accent); color:var(--accent);"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }
                });
            }
            container.innerHTML = html || `<p style="color:var(--text-muted); font-size:12px;">Nenhuma campanha encontrada.</p>`;
        }

        window.editCampaign = async function(id) {
            const snap = await get(child(ref(db), 'campaigns/' + id));
            if(!snap.exists()) return;
            const c = snap.val();

            document.getElementById('editCampaignId').value = id;
            document.getElementById('targetUrl').value = c.targetUrl;
            document.getElementById('campTitle').value = c.title;
            document.getElementById('formTitleAction').innerText = 'Editar Campanha';

            const tasksContainer = document.getElementById('tasksContainer');
            tasksContainer.innerHTML = '';
            if(c.tasks && c.tasks.length > 0) {
                c.tasks.forEach(t => {
                    addTaskField(t.type, t.url);
                });
            } else {
                addTaskField();
            }

            switchTab('create');
        }

        window.deleteCampaign = async function(id) {
            if(confirm('Tem certeza que deseja excluir esta campanha?')) {
                await remove(ref(db, 'campaigns/' + id));
                loadUserCampaigns();
            }
        }
    </script>
</body>
</html>
