<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Login / Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121216;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1a0f0f 0%, #09090b 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-sizing: border-box;
            margin: 20px;
            position: relative;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
        }

        .brand {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand span {
            color: var(--accent);
        }

        .form-control {
            width: 100%;
            padding: 14px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 5px;
            box-shadow: 0 0 15px var(--accent-glow);
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            background: #dc2626;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
            transform: translateY(-1px);
        }

        .btn-google {
            background: #18181b;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-google:hover {
            background: #27272a;
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .toggle-auth span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            transition: text-shadow 0.2s;
        }

        .toggle-auth span:hover {
            text-shadow: 0 0 8px var(--accent-glow);
            text-decoration: underline;
        }

        h2 {
            color: var(--text-main);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="authBox">
        <div class="brand">VORTEX<span>.</span></div>
        
        <div id="errorAlert" class="error-msg"></div>

        <button type="button" class="btn-google" onclick="loginWithGoogle()">
            <i class="fa-brands fa-google" style="color: var(--accent);"></i> Entrar com o Google
        </button>

        <div class="divider">ou continue com e-mail</div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <h2 id="formTitle" style="margin-top:0; font-size: 16px; margin-bottom: 15px; text-align: center; letter-spacing: 0.5px;">Entrar na Conta</h2>
            
            <input type="email" id="emailInput" class="form-control" placeholder="Seu Gmail (@gmail.com)" required>
            <input type="password" id="passInput" class="form-control" placeholder="Sua senha / Número (Mín. 6 caracteres)" required>
            
            <button type="submit" id="submitBtn" class="btn-primary">Entrar</button>
        </form>

        <div class="toggle-auth">
            <span id="toggleText" onclick="toggleMode()">Não tem uma conta? Crie agora</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        // Intercepta rota de campanha no carregamento (#/campaign/ID)
        window.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            
            if (hash.startsWith('#/campaign/')) {
                const campaignId = hash.replace('#/campaign/', '');
                
                document.getElementById('authBox').innerHTML = `
                    <div class="brand">VORTEX<span>.</span></div>
                    <h2 id="campTitle" style="margin-top: 0; text-align: center; color: var(--text-main); font-size: 18px; margin-bottom: 20px;">Carregando Campanha...</h2>
                    <div id="tasksList" style="margin: 20px 0;">
                        <p style="text-align: center; color: var(--text-muted); font-size: 14px;"><i class="fa-solid fa-spinner fa-spin"></i> Buscando tarefas...</p>
                    </div>
                    <button id="unlockBtn" class="btn-primary" style="background: #374151; color: var(--text-muted); cursor: not-allowed; box-shadow: none;" disabled>Complete as tarefas para liberar</button>
                `;

                try {
                    const snap = await get(child(ref(db), 'campaigns/' + campaignId));
                    
                    if (snap.exists()) {
                        const camp = snap.val();
                        document.getElementById('campTitle').innerText = camp.title;
                        
                        const tasksList = document.getElementById('tasksList');
                        tasksList.innerHTML = '';
                        
                        let completedTasks = {};

                        if (camp.tasks && camp.tasks.length > 0) {
                            camp.tasks.forEach((task, index) => {
                                completedTasks[index] = false;
                                const taskDiv = document.createElement('div');
                                taskDiv.style.cssText = "display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08);";
                                
                                taskDiv.innerHTML = `
                                    <span style="text-transform: capitalize; font-weight: 600; font-size: 14px; color: var(--text-main);"><i class="fa-solid fa-link" style="color: var(--accent); margin-right: 8px;"></i> ${task.type}</span>
                                    <a href="${task.url}" target="_blank" id="task-${index}" style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid var(--accent); padding: 7px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold;" onclick="window.markTaskDone(${index}, '${camp.targetUrl}')">Visitar</a>
                                `;
                                tasksList.appendChild(taskDiv);
                            });
                        } else {
                            document.getElementById('tasksList').innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhuma tarefa configurada nesta campanha.</p>';
                            const unlockBtn = document.getElementById('unlockBtn');
                            unlockBtn.style.background = 'var(--accent)';
                            unlockBtn.style.color = '#fff';
                            unlockBtn.style.cursor = 'pointer';
                            unlockBtn.style.boxShadow = '0 0 15px var(--accent-glow)';
                            unlockBtn.disabled = false;
                            unlockBtn.innerHTML = 'Acessar Link Final';
                            unlockBtn.onclick = () => { window.location.href = camp.targetUrl; };
                        }

                        window.markTaskDone = function(index, targetUrl) {
                            completedTasks[index] = true;
                            const btn = document.getElementById(`task-${index}`);
                            btn.style.background = '#10b981';
                            btn.style.borderColor = '#10b981';
                            btn.style.color = '#fff';
                            btn.innerHTML = '<i class="fa-solid fa-check"></i> Concluído';

                            const allDone = Object.values(completedTasks).every(v => v === true);
                            if (allDone) {
                                const unlockBtn = document.getElementById('unlockBtn');
                                unlockBtn.style.background = 'var(--accent)';
                                unlockBtn.style.color = '#fff';
                                unlockBtn.style.cursor = 'pointer';
                                unlockBtn.style.boxShadow = '0 0 15px var(--accent-glow)';
                                unlockBtn.disabled = false;
                                unlockBtn.innerHTML = 'Acessar Link Final';
                                unlockBtn.onclick = () => { window.location.href = targetUrl; };
                            }
                        };

                    } else {
                        document.getElementById('campTitle').innerText = 'Campanha não encontrada';
                        document.getElementById('tasksList').innerHTML = '<p style="text-align: center; color: #fca5a5;'>Este link é inválido ou a campanha foi excluída.</p>';
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById('campTitle').innerText = 'Erro ao carregar';
                    document.getElementById('tasksList').innerHTML = '<p style="text-align: center; color: #fca5a5;'>Ocorreu um erro ao buscar os dados da campanha.</p>';
                }
            }
        });

        let isLoginMode = true;

        window.toggleMode = function() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').innerText = isLoginMode ? 'Entrar na Conta' : 'Criar Nova Conta';
            document.getElementById('submitBtn').innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
            document.getElementById('toggleText').innerText = isLoginMode ? 'Não tem uma conta? Crie agora' : 'Já tem uma conta? Faça login';
            document.getElementById('errorAlert').style.display = 'none';
        }

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = 'dashboard.html';
            } catch (error) {
                showError('Não foi possível entrar com o Google. Tente novamente.');
            }
        }

        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            errorAlert.style.display = 'none';

            if (!email.endsWith('@gmail.com')) {
                showError('Por favor, insira um endereço de Gmail válido (@gmail.com).');
                return;
            }

            if (password.length < 6) {
                showError('A senha/número precisa ter pelo menos 6 caracteres.');
                return;
            }

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'dashboard.html';
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('Conta criada com sucesso!');
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                let msg = 'Ocorreu um erro. Tente novamente.';
                
                if (error.code === 'auth/invalid-email') {
                    msg = 'O formato do e-mail digitado é inválido.';
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    msg = 'Este Gmail não está cadastrado ou a senha/número está incorreto.';
                } else if (error.code === 'auth/wrong-password') {
                    msg = 'Senha ou número incorreto.';
                } else if (error.code === 'auth/email-already-in-use') {
                    msg = 'Este Gmail já possui uma conta cadastrada. Faça login.';
                } else if (error.code === 'auth/weak-password') {
                    msg = 'A senha ou número é muito fraco.';
                }

                showError(msg);
            }
        }

        function showError(message) {
            const alertBox = document.getElementById('errorAlert');
            alertBox.innerText = message;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
