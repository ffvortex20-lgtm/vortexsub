<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Verificação de Tarefas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #121216;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1a0f0f 0%, #09090b 60%);
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--panel-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.1), 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(239, 68, 68, 0.2);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            text-align: center;
        }

        .brand {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand span {
            color: var(--accent);
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: var(--text-main);
        }

        p.subtitle {
            margin: 0 0 25px 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            text-align: left;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(0, 0, 0, 0.6);
            transform: translateY(-2px);
        }

        .task-item.completed {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.05);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .task-info i {
            color: var(--accent);
        }

        .task-item.completed .task-info i {
            color: #22c55e;
        }

        .task-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        .task-item.completed .task-status {
            color: #22c55e;
            font-weight: bold;
        }

        .btn-unlock {
            background: #27272a;
            color: #71717a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: not-allowed;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: none;
            font-size: 14px;
        }

        .btn-unlock.active {
            background: var(--accent);
            color: white;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-unlock.active:hover {
            background: #dc2626;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
        }

        .loading-box {
            color: var(--text-muted);
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">VORTEX<span>.</span></div>
        <div id="contentArea">
            <div class="loading-box">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--accent); margin-bottom: 10px; display: block;"></i>
                Carregando campanha...
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let campaignData = null;
        let completedTasks = {};

        async function init() {
            let campaignId = null;
            const hash = window.location.hash;
            
            if (hash.includes('/campaign/')) {
                campaignId = hash.split('/campaign/')[1].split('?')[0];
            } else {
                const urlParams = new URLSearchParams(window.location.search);
                campaignId = urlParams.get('id');
            }

            if (!campaignId) {
                // Se não houver ID na URL, redireciona ou mantém na tela de login normal
                window.location.href = 'login.html'; // Ajuste se necessário para sua tela de login
                return;
            }

            try {
                const snap = await get(child(ref(db), 'campaigns/' + campaignId));
                if (snap.exists()) {
                    campaignData = snap.val();
                    renderPage();
                } else {
                    document.getElementById('contentArea').innerHTML = `
                        <h2 style="color: var(--accent);">Campanha não encontrada</h2>
                        <p class="subtitle">Este link pode ter expirado ou sido removido.</p>
                    `;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('contentArea').innerHTML = `
                    <h2 style="color: var(--accent);">Erro ao carregar</h2>
                    <p class="subtitle">Verifique sua conexão e tente novamente.</p>
                `;
            }
        }

        window.handleTaskClick = function(index, url) {
            // Marca a tarefa como concluída ao clicar e abrir o link
            completedTasks[index] = true;
            window.open(url, '_blank');
            renderPage();
        }

        function renderPage() {
            const totalTasks = campaignData.tasks ? campaignData.tasks.length : 0;
            let completedCount = Object.keys(completedTasks).length;
            const allDone = totalTasks > 0 && completedCount >= totalTasks;

            let tasksHtml = '';
            if (campaignData.tasks) {
                campaignData.tasks.forEach((task, index) => {
                    const isDone = completedTasks[index];
                    let icon = 'fa-link';
                    if(task.type === 'youtube') icon = 'fa-brands fa-youtube';
                    if(task.type === 'whatsapp') icon = 'fa-brands fa-whatsapp';
                    if(task.type === 'telegram') icon = 'fa-brands fa-telegram';

                    tasksHtml += `
                        <a href="javascript:void(0)" onclick="handleTaskClick(${index}, '${task.url}')" class="task-item ${isDone ? 'completed' : ''}">
                            <div class="task-info">
                                <i class="${icon}"></i>
                                <span>Tarefa ${index + 1} (${task.type.toUpperCase()})</span>
                            </div>
                            <span class="task-status">${isDone ? '<i class="fa-solid fa-check"></i> Concluído' : 'ACESSAR <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>'}</span>
                        </a>
                    `;
                });
            }

            document.getElementById('contentArea').innerHTML = `
                <h2>${campaignData.title}</h2>
                <p class="subtitle">Complete as etapas abaixo para liberar o seu acesso:</p>
                
                <div class="task-list">
                    ${tasksHtml}
                </div>

                <button id="unlockBtn" class="btn-unlock ${allDone ? 'active' : ''}" ${allDone ? `onclick="window.location.href='${campaignData.targetUrl}'"` : 'disabled'}>
                    ${allDone ? '<i class="fa-solid fa-unlock"></i> Acessar Link Final' : `Conclua as tarefas (${completedCount}/${totalTasks})`}
                </button>
            `;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
