<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#00eaff;--blue:#0077ff;--purple:#8b35ff;--green:#00ff91;--bg:#02050b}
html,body{min-height:100%;font-family:Orbitron,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;color:#fff;background:radial-gradient(circle at 50% -10%,rgba(0,234,255,.16),transparent 34%),radial-gradient(circle at 100% 100%,rgba(139,53,255,.14),transparent 30%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,234,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.045) 1px,transparent 1px);background-size:38px 38px;animation:grid 12s linear infinite}
@keyframes grid{to{background-position:0 38px,38px 0}}
.glow{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;opacity:.14}.g1{width:420px;height:420px;background:var(--cyan);top:-260px;left:-160px}.g2{width:380px;height:380px;background:var(--purple);right:-160px;bottom:-220px}
.particles{position:fixed;inset:0;overflow:hidden;pointer-events:none}.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:float linear infinite}
@keyframes float{from{transform:translateY(110vh);opacity:0}15%{opacity:.8}85%{opacity:.8}to{transform:translateY(-10vh);opacity:0}}
.card{position:relative;width:min(470px,calc(100% - 24px));padding:1px;border-radius:28px;background:linear-gradient(135deg,rgba(0,234,255,.8),rgba(139,53,255,.7),transparent 65%);box-shadow:0 25px 90px rgba(0,0,0,.8),0 0 55px rgba(0,234,255,.07);z-index:2}
.inner{position:relative;overflow:hidden;border-radius:27px;padding:32px 27px 24px;background:linear-gradient(145deg,rgba(7,18,33,.97),rgba(2,6,13,.98));backdrop-filter:blur(22px)}
.inner:after{content:"";position:absolute;inset:-50%;background:conic-gradient(from 180deg,transparent 0 70%,rgba(0,234,255,.06),transparent 78%);animation:spin 10s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.content{position:relative;z-index:2}
.topline{height:1px;position:absolute;top:0;left:12%;right:12%;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);box-shadow:0 0 15px var(--cyan)}
.avatar{width:92px;height:92px;margin:0 auto 14px;position:relative;padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 0 30px rgba(0,234,255,.22)}
.avatar:before{content:"";position:absolute;inset:-7px;border:1px solid rgba(0,234,255,.3);border-radius:50%;animation:rotate 7s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.avatar img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;border:3px solid #030912}
.brand{text-align:center;font-size:29px;font-weight:900;letter-spacing:4px;text-shadow:0 0 20px rgba(0,234,255,.4)}.brand span{color:var(--cyan)}
.sub{text-align:center;margin-top:8px;color:#667891;font-size:9px;letter-spacing:2.2px}
.status{width:max-content;margin:16px auto 23px;padding:7px 12px;border:1px solid rgba(0,255,145,.25);border-radius:999px;background:rgba(0,255,145,.035);display:flex;gap:8px;align-items:center;color:#48ffa4;font-size:8px;letter-spacing:1.4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.section{display:flex;gap:10px;align-items:center;margin-bottom:13px}.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--cyan);border:1px solid rgba(0,234,255,.35);background:rgba(0,234,255,.045);box-shadow:inset 0 0 15px rgba(0,234,255,.05)}
.section small{display:block;color:#586b84;font-size:7px;letter-spacing:2px}.section strong{display:block;margin-top:3px;font-size:12px;letter-spacing:1px}
.mainbtn{position:relative;width:100%;height:58px;border:1px solid var(--cyan);border-radius:12px;background:linear-gradient(90deg,rgba(0,234,255,.11),rgba(139,53,255,.09));color:#fff;font:800 11px Orbitron,sans-serif;letter-spacing:1.5px;cursor:pointer;overflow:hidden;box-shadow:0 0 25px rgba(0,234,255,.1),inset 0 0 20px rgba(0,234,255,.04);transition:.25s}
.mainbtn:before{content:"";position:absolute;top:0;left:-100%;width:55%;height:100%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:.7s}.mainbtn:hover:before{left:140%}.mainbtn:hover{transform:translateY(-2px);border-color:#fff;box-shadow:0 0 35px rgba(0,234,255,.25),inset 0 0 25px rgba(0,234,255,.1)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.social{height:50px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.025);color:#aab8ca;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:8px;font-weight:800;letter-spacing:1px;transition:.25s}.social:hover{transform:translateY(-2px);color:#fff;border-color:rgba(0,234,255,.45);background:rgba(0,234,255,.05);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.footer{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;color:#3f5068;font-size:6px;letter-spacing:1.4px}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,3,8,.72);backdrop-filter:blur(12px)}.overlay.show{display:flex}
.modal{width:min(430px,100%);border:1px solid rgba(0,234,255,.4);border-radius:22px;background:linear-gradient(145deg,rgba(7,19,35,.98),rgba(2,7,15,.99));box-shadow:0 0 55px rgba(0,234,255,.14);padding:22px;position:relative;overflow:hidden}.modal:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);box-shadow:0 0 18px var(--cyan)}
.modal-title{font-size:13px;font-weight:800;letter-spacing:1.5px}.modal-sub{margin-top:6px;color:#61738d;font-size:7px;letter-spacing:1.3px}
.check{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.025)}.metric label{display:block;color:#52657e;font-size:6px;letter-spacing:1.3px}.metric b{display:block;margin-top:6px;color:var(--cyan);font-size:11px;letter-spacing:.6px}.metric.online b{color:var(--green)}
.progress{height:3px;margin-top:18px;border-radius:99px;background:#0a1422;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 12px var(--cyan);animation:load 2.5s linear forwards}@keyframes load{to{width:100%}}
.redirect{margin-top:10px;text-align:center;color:#4f627b;font-size:6px;letter-spacing:1px}
@media(max-width:500px){body{padding:14px 0}.inner{padding:28px 17px 21px}.brand{font-size:24px;letter-spacing:3px}.avatar{width:82px;height:82px}.btnrow{grid-template-columns:1fr}.footer{font-size:5.5px}}
</style>

<script>
/* COLOQUE AQUI O LINK REAL DO SEU ENCURTADOR */
const REDIRECT_URL = "https://link-do-seu-encurtador.com";

for(let i=0;i<42;i++){
 const p=document.createElement("span");
 p.className="particle";
 p.style.left=Math.random()*100+"%";
 p.style.animationDuration=(5+Math.random()*10)+"s";
 p.style.animationDelay=(-Math.random()*10)+"s";
 const s=1+Math.random()*2;p.style.width=s+"px";p.style.height=s+"px";
 document.getElementById("particles").appendChild(p);
}

async function startRedirect(){
 const overlay=document.getElementById("overlay");
 overlay.classList.add("show");

 const start=performance.now();

 try{
   const countryPromise=fetch("https://ipapi.co/json/",{cache:"no-store"}).then(r=>r.json());
   const targetPromise=fetch(REDIRECT_URL,{method:"HEAD",mode:"no-cors",cache:"no-store"});
   const [geo]=await Promise.allSettled([countryPromise,targetPromise]);

   const elapsed=Math.round(performance.now()-start);

   if(geo.status==="fulfilled" && geo.value){
      document.getElementById("country").textContent =
        geo.value.country_name || geo.value.country_code || "--";
   }else{
      document.getElementById("country").textContent="N/D";
   }

   document.getElementById("latency").textContent=elapsed+" ms";
   document.getElementById("response").textContent=elapsed+" ms";
   document.getElementById("siteStatus").textContent="ONLINE";
 }catch(e){
   const elapsed=Math.round(performance.now()-start);
   document.getElementById("country").textContent="N/D";
   document.getElementById("latency").textContent=elapsed+" ms";
   document.getElementById("response").textContent=elapsed+" ms";
   document.getElementById("siteStatus").textContent="ACESSÍVEL";
 }

 setTimeout(()=>window.location.href=REDIRECT_URL,2600);
}
