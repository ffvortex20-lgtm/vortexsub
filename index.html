*{box-sizing:border-box;margin:0;padding:0}:root{--c:#00eaff;--p:#863cff;--g:#00ff91}

.bg{position:fixed;border-radius:50%;filter:blur(100px);opacity:.14;pointer-events:none}.b1{width:400px;height:400px;background:var(--c);top:-250px;left:-150px}.b2{width:380px;height:380px;background:var(--p);right:-160px;bottom:-230px}

.line{position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--c),var(--p),transparent);box-shadow:0 0 16px var(--c)}

h1{text-align:center;margin-top:15px;font-size:27px;letter-spacing:4px;text-shadow:0 0 20px rgba(0,234,255,.4)}h1 span{color:var(--c)}.sub{text-align:center;margin-top:7px;color:#63758e;font-size:8px;letter-spacing:2px}
.online{width:max-content;margin:15px auto 23px;display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid rgba(0,255,145,.25);border-radius:99px;background:rgba(0,255,145,.035);color:#4affa5;font-size:7px;letter-spacing:1.2px}.dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.info{padding:15px;border:1px solid rgba(0,234,255,.12);border-radius:12px;background:rgba(0,234,255,.025);text-align:center;color:#71849d;font-size:7px;line-height:1.8;letter-spacing:.7px;margin-bottom:12px}
.btn{width:100%;height:58px;border:1px solid var(--c);border-radius:12px;background:linear-gradient(90deg,rgba(0,234,255,.11),rgba(134,60,255,.12));color:white;font:800 10px Orbitron;letter-spacing:1.4px;cursor:pointer;position:relative;overflow:hidden;transition:.25s}.btn:before{content:"";position:absolute;top:0;left:-100%;width:55%;height:100%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transition:.7s}.btn:hover:before{left:140%}.btn:hover{transform:translateY(-2px);border-color:#fff;box-shadow:0 0 30px rgba(0,234,255,.22)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.social{height:45px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025);color:#9bacbf;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;letter-spacing:.7px;transition:.2s}.social:hover{color:#fff;border-color:rgba(0,234,255,.4);transform:translateY(-2px)}
.footer{display:flex;justify-content:space-between;margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.05);color:#405269;font-size:5.5px;letter-spacing:1px}
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,3,8,.76);backdrop-filter:blur(12px)}.overlay.show{display:flex}.modal{width:min(420px,100%);padding:22px;border-radius:20px;border:1px solid rgba(0,234,255,.4);background:linear-gradient(145deg,rgba(7,19,35,.98),rgba(2,7,15,.99));box-shadow:0 0 55px rgba(0,234,255,.15);position:relative}.modal:before{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),var(--p),transparent);box-shadow:0 0 15px var(--c)}.mt{font-size:11px;font-weight:800;letter-spacing:1.4px}.ms{margin-top:6px;color:#61738d;font-size:7px;letter-spacing:1px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.metric{padding:12px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025)}.metric label{display:block;color:#52657e;font-size:6px;letter-spacing:1px}.metric b{display:block;margin-top:6px;color:var(--c);font-size:10px}.metric.green b{color:var(--g)}.progress{height:3px;margin-top:17px;background:#0b1522;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--p));box-shadow:0 0 12px var(--c);animation:load 2.1s linear forwards}@keyframes load{to{width:100%}}.redirect{text-align:center;margin-top:9px;color:#50627a;font-size:6px;letter-spacing:1px}
@media(max-width:450px){.inner{padding:27px 17px 20px}h1{font-size:23px}.links{grid-template-columns:1fr}}

<div class="metric green"><label>STATUS</label><b id="siteStatus">TESTANDO</b></div>

<script>
const REDIRECT_URL="key.html";
const particles=document.getElementById("particles");
for(let i=0;i<48;i++){const p=document.createElement("i");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=5+Math.random()*10+"s";p.style.animationDelay=-Math.random()*10+"s";const s=1+Math.random()*2;p.style.width=s+"px";p.style.height=s+"px";particles.appendChild(p)}

async function geo(){try{const r=await fetch("https://ipapi.co/json/",{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
async function check(){
 const overlay=document.getElementById("overlay"),start=performance.now(),btn=document.getElementById("getKey");
 btn.disabled=true;btn.style.opacity=".55";overlay.classList.add("show");
 try{
   const geoPromise=geo();
   let online=false;
   try{const r=await fetch(REDIRECT_URL+"?ping="+Date.now(),{cache:"no-store"});online=r.ok}catch(e){}
   const ms=Math.max(1,Math.round(performance.now()-start)),g=await geoPromise;
   document.getElementById("siteStatus").textContent=online?"ONLINE":"READY";
   document.getElementById("latency").textContent=ms+" ms";
   document.getElementById("response").textContent=ms+" ms";
   document.getElementById("country").textContent=g?.country_name||g?.country_code||"N/D";
   setTimeout(()=>location.href=REDIRECT_URL,2200);
 }catch(e){setTimeout(()=>location.href=REDIRECT_URL,1600)}
}
document.getElementById("getKey").onclick=check;
</script>
