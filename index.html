<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexSub - Entrar / Criar Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .auth-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-google {
            background: white;
            color: #1e293b;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
            margin-top: 0.75rem;
        }

        .btn-google:hover {
            background: #f1f5f9;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.2rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider::before {
            margin-right: .5em;
        }

        .divider::after {
            margin-left: .5em;
        }

        .switch-auth {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .switch-auth a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .switch-auth a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">
            <h1><i class="fa-solid fa-bolt"></i> VortexSub</h1>
        </div>

        <form id="authForm">
            <h2 id="formTitle" style="font-size: 1.1rem; margin-bottom: 1rem; text-align: center;">Entrar na sua conta</h2>
            
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" class="form-control" autocomplete="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required placeholder="••••••••">
            </div>

            <button type="button" id="submitBtn" class="btn-primary">Entrar</button>
        </form>

        <button type="button" class="btn-google" id="googleBtn">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continuar com o Google
        </button>

        <div class="divider">ou</div>

        <div class="switch-auth">
            <span id="switchText">Não tem uma conta?</span> <a id="switchToggleBtn">Criar conta</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397" // Certifique-se de usar um App ID Web do Firebase
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const googleProvider = new GoogleAuthProvider();

        setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));

        let isSignUp = false;

        document.getElementById('switchToggleBtn').addEventListener('click', () => {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerText = isSignUp ? 'Criar nova conta' : 'Entrar na sua conta';
            document.getElementById('submitBtn').innerText = isSignUp ? 'Cadastrar' : 'Entrar';
            document.getElementById('switchText').innerText = isSignUp ? 'Já tem uma conta?' : 'Não tem uma conta?';
            document.getElementById('switchToggleBtn').innerText = isSignUp ? 'Entrar' : 'Criar conta';
        });

        function redirectUser(email) {
            if (email && email.trim().toLowerCase() === 'ffvortex20@gmail.com') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        async function saveUserData(user) {
            try {
                await set(ref(db, 'users/' + user.uid), {
                    uid: user.uid,
                    email: user.email,
                    lastLogin: Date.now()
                });
            } catch (err) {
                console.error("Erro ao salvar no Database:", err);
            }
        }

        // Mudança para clique direto no botão em vez de submit de form, evitando o reset por autocomplete
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                alert('Preencha o e-mail e a senha corretamente.');
                return;
            }

            try {
                let userCred;
                if (isSignUp) {
                    userCred = await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    userCred = await signInWithEmailAndPassword(auth, email, password);
                }
                await saveUserData(userCred.user);
                redirectUser(userCred.user.email);
            } catch (error) {
                alert("Erro: " + error.message);
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await saveUserData(result.user);
                redirectUser(result.user.email);
            } catch (error) {
                alert("Erro ao entrar com Google: " + error.message);
            }
        });
    </script>
</body>
</html>
