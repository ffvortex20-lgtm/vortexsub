<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Login / Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
            margin: 20px;
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-main);
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toggle-auth span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }

        .toggle-auth span:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand">VORTEX</div>
        
        <div id="errorAlert" class="error-msg"></div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <h2 id="formTitle" style="margin-top:0; font-size: 20px; margin-bottom: 20px; text-align: center;">Entrar na Conta</h2>
            
            <input type="email" id="emailInput" class="form-control" placeholder="Seu Gmail (@gmail.com)" required>
            <input type="password" id="passInput" class="form-control" placeholder="Sua senha / Número (Mín. 6 caracteres)" required>
            
            <button type="submit" id="submitBtn" class="btn-primary">Entrar</button>
        </form>

        <div class="toggle-auth">
            <span id="toggleText" onclick="toggleMode()">Não tem uma conta? Crie agora</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:web:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLoginMode = true;

        window.toggleMode = function() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').innerText = isLoginMode ? 'Entrar na Conta' : 'Criar Nova Conta';
            document.getElementById('submitBtn').innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
            document.getElementById('toggleText').innerText = isLoginMode ? 'Não tem uma conta? Crie agora' : 'Já tem uma conta? Faça login';
            document.getElementById('errorAlert').style.display = 'none';
        }

        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            errorAlert.style.display = 'none';

            // Validação estrita de Gmail
            if (!email.endsWith('@gmail.com')) {
                showError('Por favor, insira um endereço de Gmail válido (@gmail.com).');
                return;
            }

            // Validação do número/senha
            if (password.length < 6) {
                showError('A senha/número precisa ter pelo menos 6 caracteres.');
                return;
            }

            try {
                if (isLoginMode) {
                    // Tenta fazer login (O Firebase valida se o Gmail existe e se a senha confere)
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'dashboard.html';
                } else {
                    // Tenta criar a conta
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('Conta criada com sucesso!');
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                let msg = 'Ocorreu um erro. Tente novamente.';
                
                // Traduzindo os erros mais comuns do Firebase para o usuário
                if (error.code === 'auth/invalid-email') {
                    msg = 'O formato do e-mail digitado é inválido.';
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    msg = 'Este Gmail não está cadastrado ou a senha/número está incorreto.';
                } else if (error.code === 'auth/wrong-password') {
                    msg = 'Senha ou número incorreto.';
                } else if (error.code === 'auth/email-already-in-use') {
                    msg = 'Este Gmail já possui uma conta cadastrada. Faça login.';
                } else if (error.code === 'auth/weak-password') {
                    msg = 'A senha ou número é muito fraco.';
                }

                showError(msg);
            }
        }

        function showError(message) {
            const alertBox = document.getElementById('errorAlert');
            alertBox.innerText = message;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
