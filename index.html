<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Hub - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            background-image: 
                linear-gradient(to right, rgba(30, 41, 59, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-slate-900/90 border-2 border-indigo-500/40 p-8 rounded-3xl shadow-[0_0_30px_rgba(99,102,241,0.15)] w-full max-w-sm text-center backdrop-blur-md">
        
        <!-- Avatar / Topo -->
        <div class="mb-6">
            <div class="w-20 h-20 bg-slate-950 border-2 border-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg overflow-hidden animate-pulse">
                <i class="fa-solid fa-cube text-indigo-400 text-3xl"></i>
            </div>
            <h1 class="text-xl font-black tracking-wider flex items-center justify-center gap-2">
                VORTEX PORTAL <i class="fa-solid fa-circle-check text-sky-400 text-sm"></i>
            </h1>
            <div class="inline-flex items-center gap-1.5 bg-emerald-950/80 border border-emerald-500/40 text-emerald-400 text-[10px] font-bold px-3 py-1 rounded-full mt-2 uppercase tracking-wider">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Autenticação Segura
            </div>
        </div>

        <p class="text-slate-400 text-xs mb-6">Faça login com sua conta Google para gerenciar suas páginas e acessos.</p>

        <button onclick="loginGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-100 text-slate-950 font-black py-3.5 px-4 rounded-2xl transition duration-200 shadow-[0_0_20px_rgba(255,255,255,0.2)] text-sm">
            <i class="fa-brands fa-google text-red-500 text-lg"></i>
            Entrar com o Google
        </button>

        <div id="statusMessage" class="mt-4 text-xs text-slate-400"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:android:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginGoogle = async function() {
            const status = document.getElementById("statusMessage");
            try {
                status.innerText = "Conectando ao Google...";
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                localStorage.setItem("vortex_user", JSON.stringify({ name: user.displayName, email: user.email, uid: user.uid }));
                window.location.href = "admin.html";
            } catch (error) {
                console.error(error);
                status.innerText = "Erro ao autenticar. Tente novamente.";
                status.classList.add("text-red-400");
            }
        }
    </script>
</body>
</html>
