<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Hub - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <div class="mb-6">
            <i class="fa-solid fa-cube text-indigo-500 text-5xl mb-3 animate-pulse"></i>
            <h1 class="text-2xl font-bold tracking-wide">Vortex Portal</h1>
            <p class="text-slate-400 text-sm mt-1">Faça login com sua conta Google para continuar</p>
        </div>

        <button onclick="loginGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg">
            <i class="fa-brands fa-google text-red-500 text-lg"></i>
            Entrar com o Google
        </button>

        <div id="statusMessage" class="mt-4 text-sm text-slate-400"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:android:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginGoogle = async function() {
            const status = document.getElementById("statusMessage");
            try {
                status.innerText = "Conectando...";
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Redireciona para o painel ou página de liberação
                localStorage.setItem("vortex_user", JSON.stringify({ name: user.displayName, email: user.email, uid: user.uid }));
                window.location.href = "liberar.html";
            } catch (error) {
                console.error(error);
                status.innerText = "Erro ao autenticar. Tente novamente.";
                status.classList.add("text-red-400");
            }
        }
    </script>
</body>
</html>
