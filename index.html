<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX HUB • Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--c:#00eaff;--p:#863cff;--g:#00ff91}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;background:#02050b;color:#fff;font-family:Orbitron,sans-serif}
.card{width:min(470px,100%);padding:30px;border-radius:27px;background:linear-gradient(145deg,rgba(7,18,33,.98),rgba(2,6,13,.99));border:1px solid rgba(0,234,255,.3);text-align:center;box-shadow:0 25px 90px #000}
h1{font-size:25px;letter-spacing:3px;margin-bottom:20px}h1 span{color:var(--c)}
.btn{width:100%;height:51px;border-radius:10px;border:1px solid var(--c);background:rgba(0,234,255,.1);color:#fff;font:800 11px Orbitron;letter-spacing:1px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(0,234,255,.25);box-shadow:0 0 25px rgba(0,234,255,.3)}
</style>
</head>
<body>
<div class="card">
    <h1>VORTEX<span>HUB</span></h1>
    <p style="color:#7890ab;font-size:8px;margin-bottom:25px;letter-spacing:1px">CLIQUE ABAIXO PARA OBTER SUA KEY</p>
    <button class="btn" onclick="clicarPegarKey()">⚡ PEGAR KEY</button>
</div>

<script>
// LINK DO SEU ENCURTADOR QUE APONTA PARA O KEY.HTML COM O TOKEN
const REDIRECT_URL = "https://www.vortexsub.shop/key.html?token=vtx_auth";

async function clicarPegarKey() {
    try {
        const response = await fetch("https://ipapi.co/json/");
        const data = await response.json();
        const userIp = data.ip || "unknown";

        localStorage.setItem("vtx_client_ip", userIp);
        localStorage.setItem("vtx_authorized", "true");
    } catch (e) {
        localStorage.setItem("vtx_client_ip", "unknown");
        localStorage.setItem("vtx_authorized", "true");
    }

    window.location.href = REDIRECT_URL;
}
</script>
</body>
</html>
