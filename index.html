<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Hub - Início</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #09090b;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e, #09090b);
        }
        .hub-container {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p { color: #a1a1aa; font-size: 14px; margin-bottom: 30px; }
        .btn {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-block;
            width: 100%;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>VORTEX HUB</h1>
        <p>Acesse o melhor painel com segurança premium.</p>
        <!-- COLOQUE O LINK DO SEU ENCURTADOR ABAIXO -->
        <button class="btn" onclick="window.location.href='https://link-do-seu-encurtador.com'">Pegar Key</button>
    </div>
</body>
</html>
