<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KM TEAM - Key</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #161616;
      border: 1px solid #282828;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .tag {
      color: #ff2a2a;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .key-box {
      background-color: #080808;
      border: 1px dashed #ff2a2a;
      border-radius: 10px;
      padding: 16px;
      font-family: monospace;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      word-break: break-all;
      color: #ffffff;
    }
    .btn-copy {
      background-color: #e60000;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }
    .btn-copy:active {
      transform: scale(0.98);
    }
    .info {
      color: #888888;
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.5;
    }
    .hidden {
      display: none !important;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- TELA DE MANUTENÇÃO -->
  <div id="maintenance-view" class="card hidden">
    <div class="tag">SISTEMA INDISPONÍVEL</div>
    <div class="title" style="color: #ff2a2a;">EM MANUTENÇÃO</div>
    <p style="color: #aaaaaa; font-size: 14px; line-height: 1.5;">
      Estamos realizando atualizações no sistema. Tente novamente mais tarde!
    </p>
  </div>

  <!-- TELA PRINCIPAL -->
  <div id="main-view" class="card">
    <div class="tag">KEY PÚBLICA</div>
    <div class="title">Use esta key no app</div>
    <div class="key-box" id="key-display">Carregando...</div>
    <button class="btn-copy" id="btn-copy" onclick="copyKey()">COPIAR KEY</button>
    <div class="info" id="validity-display">Válida até --/--/----</div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://master12-13be0-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const configRef = database.ref('config');

    configRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const mainView = document.getElementById('main-view');
      const maintenanceView = document.getElementById('maintenance-view');

      if (!data) return;

      if (data.maintenance === true || data.maintenance === "true") {
        mainView.classList.add('hidden');
        maintenanceView.classList.remove('hidden');
      } else {
        maintenanceView.classList.add('hidden');
        mainView.classList.remove('hidden');

        document.getElementById('key-display').innerText = data.current_key || 'SEM KEY DISPONÍVEL';
        document.getElementById('validity-display').innerText = 'Válida até ' + (data.expiration_date || '--/--/----');
      }
    });

    function copyKey() {
      const keyText = document.getElementById('key-display').innerText;
      if (keyText === 'Carregando...' || keyText === 'SEM KEY DISPONÍVEL') return;

      navigator.clipboard.writeText(keyText).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.innerText = 'COPIADA!';
        btn.style.backgroundColor = '#00aa00';
        setTimeout(() => {
          btn.innerText = 'COPIAR KEY';
          btn.style.backgroundColor = '#e60000';
        }, 2000);
      });
    }
  </script>
</body>
</html>
