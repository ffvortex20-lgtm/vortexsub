<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM TEAM - Painel Administrativo Completo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', Arial, sans-serif;
}

:root {
    --accent: #8b5cf6;
    --accent-cyan: #06b6d4;
    --accent-glow: rgba(139, 92, 246, 0.4);
    --bg-deep: #030307;
    --card-bg: rgba(15, 15, 25, 0.8);
    --border-color: rgba(139, 92, 246, 0.25);
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    background-color: var(--bg-deep);
    background-image: 
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.2), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.15), transparent 45%);
}

/* =========================
   FUNDO AURORA & ORBS
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.aurora-orb {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.18;
    animation: orbMove 12s ease-in-out infinite alternate;
}

.orb-1 {
    background: #8b5cf6;
    top: -100px;
    left: -100px;
}

.orb-2 {
    background: #06b6d4;
    bottom: -100px;
    right: -100px;
    animation-delay: -6s;
}

@keyframes orbMove {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(80px, 60px) scale(1.15); }
}

/* =========================
   PARTÍCULAS
========================= */

.particles {
    position: absolute;
    inset: 0;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #c4b5fd;
    box-shadow: 0 0 10px #8b5cf6;
    animation: particleFloat linear infinite;
}

@keyframes particleFloat {
    from { transform: translateY(110vh) scale(0.5); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.8; }
    to { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* =========================
   CARD ADMIN
========================= */

.card {
    position: relative;
    width: 100%;
    max-width: 540px;
    padding: 35px 30px;
    border-radius: 30px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 0 40px rgba(139, 92, 246, 0.1);
    z-index: 10;
    animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
}

@keyframes cardEntrance {
    from { opacity: 0; transform: translateY(35px) scale(0.93); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* =========================
   CABEÇALHO
========================= */

.logo {
    width: 60px;
    height: 60px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
}

.tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 50px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #c4b5fd;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 0 auto 10px;
}

.tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #06b6d4;
    box-shadow: 0 0 8px #06b6d4;
}

.title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    text-align: center;
}

.subtitle {
    color: #94a3b8;
    font-size: 12px;
    text-align: center;
    margin-bottom: 20px;
}

/* =========================
   ABAS DE NAVEGAÇÃO
========================= */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: rgba(5, 5, 10, 0.5);
    padding: 5px;
    border-radius: 14px;
    border: 1px solid rgba(139, 92, 246, 0.2);
}

.tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.tab-btn.active {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: #fff;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
}

.tab-content {
    display: none;
    overflow-y: auto;
    padding-right: 4px;
    flex: 1;
}

.tab-content.active {
    display: block;
}

/* =========================
   FORMULÁRIO & CAMPOS
========================= */

.form-group {
    margin-bottom: 14px;
}

.form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #cbd5e1;
    margin-bottom: 5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.form-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(5, 5, 10, 0.6);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #f8fafc;
    font-size: 13px;
    outline: none;
    transition: all 0.3s ease;
}

.form-input:focus {
    border-color: #06b6d4;
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
}

/* Switches de Manutenção */
.toggles-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.toggle-card {
    background: rgba(5, 5, 10, 0.4);
    border: 1px solid rgba(139, 92, 246, 0.2);
    padding: 12px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
}

.toggle-card label {
    font-size: 11px;
    font-weight: 700;
    color: #cbd5e1;
}

.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 20px;
}

.switch input { 
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: rgba(255, 255, 255, 0.1);
    transition: 0.3s;
    border-radius: 20px;
    border: 1px solid rgba(139, 92, 246, 0.3);
}

.slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 2px;
    bottom: 2px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #8b5cf6;
    border-color: #06b6d4;
}

input:checked + .slider:before {
    transform: translateX(20px);
}

/* =========================
   BOTÕES
========================= */

.btn {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.25s ease;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.35);
    margin-top: 10px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(139, 92, 246, 0.55);
}

.btn:active {
    transform: scale(0.98);
}

.success-state {
    background: linear-gradient(135deg, #10b981, #059669) !important;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4) !important;
}

/* Textareas para JSON ou Dados Brutos */
.json-textarea {
    width: 100%;
    height: 140px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(5, 5, 10, 0.7);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #38bdf8;
    font-family: monospace;
    font-size: 12px;
    resize: none;
    outline: none;
}
</style>

<!-- Firebase SDK (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

<div class="background">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="particles" id="particles"></div>
</div>

<div class="card">
    <div class="logo">VM</div>
    <div class="tag">ADMIN CONTROL PANEL</div>
    <div class="title">Gerenciador Geral</div>
    <div class="subtitle">Controle completo de nós, chaves e manutenções do banco.</div>

    <!-- ABAS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-config', this)">Config & Manutenção</button>
        <button class="tab-btn" onclick="switchTab('tab-extras', this)">Site & Updates</button>
        <button class="tab-btn" onclick="switchTab('tab-raw', this)">Dados (JSON)</button>
    </div>

    <!-- ABA 1: CONFIG & MANUTENÇÕES -->
    <div id="tab-config" class="tab-content active">
        <div class="form-group">
            <label class="form-label">Chave Atual (config/current_key)</label>
            <input type="text" id="admin-key" class="form-input" placeholder="Carregando...">
        </div>

        <div class="form-group">
            <label class="form-label">Validade (config/expiration_date)</label>
            <input type="text" id="admin-date" class="form-input" placeholder="Carregando...">
        </div>

        <div class="toggles-grid">
            <div class="toggle-card">
                <label>Manutenção Config</label>
                <label class="switch">
                    <input type="checkbox" id="check-config-maint">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-card">
                <label>Manutenção Lag</label>
                <label class="switch">
                    <input type="checkbox" id="check-lag-maint">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-card" style="grid-column: span 2;">
                <label>Manutenção M (manutencaoM)</label>
                <label class="switch">
                    <input type="checkbox" id="check-m-maint">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <button class="btn" id="save-btn-1" onclick="saveConfigChanges()">SALVAR ALTERAÇÕES</button>
    </div>

    <!-- ABA 2: SITE & UPDATES -->
    <div id="tab-extras" class="tab-content">
        <div class="form-group">
            <label class="form-label">Configurações do Site (siteconf)</label>
            <input type="text" id="admin-siteconf" class="form-input" placeholder="Parâmetro do site...">
        </div>

        <div class="form-group">
            <label class="form-label">Atualização de App (updateU)</label>
            <input type="text" id="admin-updateu" class="form-input" placeholder="Versão ou link de update...">
        </div>

        <button class="btn" id="save-btn-2" onclick="saveExtrasChanges()">SALVAR SITE & UPDATES</button>
    </div>

    <!-- ABA 3: DADOS BRUTOS (usuariosT & classeur) -->
    <div id="tab-raw" class="tab-content">
        <div class="form-group">
            <label class="form-label">Dados de Usuários (usuariosT)</label>
            <textarea id="json-usuarios" class="json-textarea" placeholder="Carregando usuariosT..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Configurações / Classeur (classeur)</label>
            <textarea id="json-classeur" class="json-textarea" placeholder="Carregando classeur..."></textarea>
        </div>

        <button class="btn" id="save-btn-3" onclick="saveRawChanges()">SALVAR DADOS BRUTOS</button>
    </div>
</div>

<script>
/* =========================
   PARTÍCULAS
========================= */
const particles = document.getElementById("particles");
for(let i = 0; i < 30; i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (7 + Math.random() * 10) + "s";
    p.style.animationDelay = (-Math.random() * 10) + "s";
    p.style.opacity = Math.random();
    particles.appendChild(p);
}

/* =========================
   EFEITOS SONOROS (WEB AUDIO)
========================= */
let audioCtx = null;
function sound(type){
    try{
        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if(type === "click"){
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }
        if(type === "success"){
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }catch(e){}
}

/* =========================
   CONTROLE DE ABAS
========================= */
function switchTab(tabId, btn) {
    sound("click");
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

/* =========================
   FIREBASE CONEXÃO
========================= */
const firebaseConfig = {
    databaseURL: "https://vmteam-fcb3e-default-rtdb.firebaseio.com"
};

try {
    firebase.initializeApp(firebaseConfig);
} catch(e) {}

const db = firebase.database();

// Carregamento em tempo real de todos os nós mapeados
db.ref("config").on("value", (snapshot) => {
    const data = snapshot.val();
    if(data) {
        document.getElementById("admin-key").value = data.current_key || "";
        document.getElementById("admin-date").value = data.expiration_date || "";
        document.getElementById("check-config-maint").checked = (data.maintenance === true || data.maintenance === "true");
    }
});

db.ref("Manutencaolag").on("value", (snapshot) => {
    const val = snapshot.val();
    document.getElementById("check-lag-maint").checked = (val === true || val === "true");
});

db.ref("manutencaoM").on("value", (snapshot) => {
    const val = snapshot.val();
    document.getElementById("check-m-maint").checked = (val === true || val === "true");
});

db.ref("siteconf").on("value", (snapshot) => {
    const val = snapshot.val();
    document.getElementById("admin-siteconf.value") ? document.getElementById("admin-siteconf").value = (typeof val === 'object' ? JSON.stringify(val) : val) : document.getElementById("admin-siteconf").value = val || "";
});

db.ref("updateU").on("value", (snapshot) => {
    const val = snapshot.val();
    document.getElementById("admin-updateu").value = (typeof val === 'object' ? JSON.stringify(val) : val) || "";
});

db.ref("usuariosT").on("value", (snapshot) => {
    const val = snapshot.val();
    document.getElementById("json-usuarios").value = val ? JSON.stringify(val, null, 2) : "{}";
});

db.ref("classeur").on("value", (snapshot) => {
    const val = snapshot.val();
    document.getElementById("json-classeur").value = val ? JSON.stringify(val, null, 2) : "{}";
});

/* =========================
   FUNÇÕES DE SALVAR
========================= */
function saveConfigChanges() {
    sound("click");
    const newKey = document.getElementById("admin-key").value;
    const newDate = document.getElementById("admin-date").value;
    const configMaint = document.getElementById("check-config-maint").checked;
    const lagMaint = document.getElementById("check-lag-maint").checked;
    const mMaint = document.getElementById("check-m-maint").checked;

    Promise.all([
        db.ref("config").update({ current_key: newKey, expiration_date: newDate, maintenance: configMaint }),
        db.ref("Manutencaolag").set(lagMaint),
        db.ref("manutencaoM").set(mMaint)
    ]).then(() => {
        triggerSuccess("save-btn-1");
    }).catch(err => alert("Erro: " + err.message));
}

function saveExtrasChanges() {
    sound("click");
    const siteVal = document.getElementById("admin-siteconf").value;
    const updateVal = document.getElementById("admin-updateu").value;

    Promise.all([
        db.ref("siteconf").set(siteVal),
        db.ref("updateU").set(updateVal)
    ]).then(() => {
        triggerSuccess("save-btn-2");
    }).catch(err => alert("Erro: " + err.message));
}

function saveRawChanges() {
    sound("click");
    try {
        const jsonUsers = JSON.parse(document.getElementById("json-usuarios").value);
        const jsonClass = JSON.parse(document.getElementById("json-classeur").value);

        Promise.all([
            db.ref("usuariosT").set(jsonUsers),
            db.ref("classeur").set(jsonClass)
        ]).then(() => {
            triggerSuccess("save-btn-3");
        }).catch(err => alert("Erro: " + err.message));
    } catch(e) {
        alert("Erro de sintaxe no JSON inserido. Verifique as chaves e colchetes.");
    }
}

function triggerSuccess(btnId) {
    const btn = document.getElementById(btnId);
    btn.classList.add("success-state");
    const originalText = btn.innerHTML;
    btn.innerHTML = "✓ &nbsp; SALVO COM SUCESSO!";
    sound("success");

    setTimeout(() => {
        btn.classList.remove("success-state");
        btn.innerHTML = originalText;
    }, 2200);
}
</script>

</body>
</html>
