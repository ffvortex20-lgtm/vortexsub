<script>
const dbUrl="https://sitevendas-26cf6-default-rtdb.firebaseio.com";
const urlParams=new URLSearchParams(location.search);

if(location.protocol==="file:"){alert("Esta página deve ser aberta por um servidor.");location.replace("index.html")}
if(!urlParams.get("auth")){alert("Esta página expirou ou foi bloqueada.");location.replace("index.html")}

async function iniciarGeracao(){
 const btn=document.getElementById("btnGerar"),loading=document.getElementById("loading");
 btn.style.display="none";loading.style.display="block";
 try{
  const res=await fetch("https://api.ipify.org?format=json",{cache:"no-store"});
  const data=await res.json();
  const ip=data.ip;
  await processarFirebase(ip.replace(/\./g,"_"),ip);
 }catch(e){
  alert("Falha na conexão. Verifique sua conexão ou bloqueador.");
  btn.style.display="block";loading.style.display="none";
 }
}

async function processarFirebase(safeIp,realIp){
 const loading=document.getElementById("loading"),keyArea=document.getElementById("keyArea"),txt=document.getElementById("txtKey");
 const now=Date.now(),validade=3600000;
 try{
  const res=await fetch(`${dbUrl}/ips/${safeIp}.json`,{cache:"no-store"});
  const data=await res.json();

  if(data){
   if(now-data.timestamp>validade){
    await fetch(`${dbUrl}/ips/${safeIp}.json`,{method:"DELETE"});
    alert("Sessão de 1 hora finalizada.");
    location.replace("index.html");return;
   }
   txt.textContent=data.key;
  }else{
   const key="VORTEX-"+Math.random().toString(36).substring(2,10).toUpperCase();
   await fetch(`${dbUrl}/ips/${safeIp}.json`,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ip:realIp,key:key,timestamp:now})
   });
   txt.textContent=key;
  }
  loading.style.display="none";keyArea.style.display="block";
 }catch(e){
  alert("Erro ao validar no Firebase.");
  location.replace("index.html");
 }
}

function copiarKey(){
 const key=document.getElementById("txtKey").textContent;
 navigator.clipboard.writeText(key).then(()=>alert("Key copiada!")).catch(()=>alert("Não foi possível copiar."));
}
</script>
