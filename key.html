<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexHub - Liberar Acesso</title>
    <!-- Fonte Oswald para combinar perfeitamente com a tipografia gamer do print -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }

        body {
            background-color: #030303; /* Fundo super escuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Grade idêntica à da imagem */
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .panel-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Avatar com Neon Ciano */
        .avatar-box {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: #0a0a0a;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6), inset 0 0 10px rgba(0, 210, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            font-size: 35px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #00d2ff;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .online-status {
            font-size: 13px;
            color: #00ff00;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffaa00;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Container dos Botões */
        .buttons-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Espaçamento entre os botões */
        }

        /* Botão Principal - Neon */
        .btn-gerar {
            width: 100%;
            background-color: #001018; /* Fundo azul bem escuro */
            border: 2px solid #00d2ff;
            color: #00d2ff;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3), inset 0 0 10px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-bottom: 10px; /* Espaço extra abaixo do botão principal */
        }

        .btn-gerar:hover {
            background-color: #001a2a;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6), inset 0 0 15px rgba(0, 210, 255, 0.3);
        }

        /* Botões Secundários */
        .btn-secundario {
            width: 100%;
            background-color: #000812;
            border: 1px solid #003388;
            color: #0099ff;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-secundario:hover {
            border-color: #0055ff;
            color: #00ccff;
            background-color: #001122;
        }

        /* Área da Key Gerada */
        .key-result {
            display: none;
            width: 100%;
            background-color: #001500;
            border: 1px solid #00ff00;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .key-result span {
            display: block;
            color: #00ff00;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .btn-copiar {
            background-color: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-copiar:hover {
            background-color: #00ff00;
            color: #000;
        }

        #loading {
            display: none;
            color: #00d2ff;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <!-- Logo e Status -->
        <div class="avatar-box">🛡️</div>
        <div class="brand-name">VortexHub</div>
        <div class="online-status">
            <div class="dot"></div> USUÁRIOS ONLINE
        </div>

        <div class="section-title">
            🔓 LIBERAR ACESSO
        </div>

        <div id="loading">AGUARDE, VALIDANDO IP...</div>

        <!-- Onde a Key Aparece -->
        <div class="key-result" id="keyArea">
            <span id="txtKey">VORTEX-XXXXX</span>
            <button class="btn-copiar" onclick="copiarKey()">COPIAR KEY</button>
        </div>

        <!-- Botões -->
        <div class="buttons-wrapper">
            <button class="btn-gerar" id="btnGerar" onclick="iniciarGeracao()">
                🔑 GERAR KEY VORTEX
            </button>

            <button class="btn-secundario">⬇️ DOWNLOAD SCRIPT</button>
            <button class="btn-secundario">📚 TUTORIAL SCRIPT</button>
            <button class="btn-secundario">⏩ PASSADOR DE ENCURTADOR</button>
            <button class="btn-secundario">📱 TUTORIAL ENCURTADOR</button>
            <button class="btn-secundario" onclick="window.open('https://chat.whatsapp.com/SEULINK', '_blank')">💬 CANAL DO WHATSAPP</button>
        </div>
    </div>

    <script>
        // FIREBASE E CONFIGURAÇÕES DE PROTEÇÃO
        const dbUrl = "https://sitevendas-26cf6-default-rtdb.firebaseio.com";
        const urlParams = new URLSearchParams(window.location.search);

        // Bloqueia se tentar salvar no PC (Anti-burla)
        if (window.location.protocol === 'file:') {
            alert("Essa pagina foi bloqueada por tentativa de burlacão");
            window.location.replace("index.html");
        }

        // Bloqueia se não passar pelo encurtador corretamente
        if (!urlParams.get('auth')) {
            alert("Esta página expirou ou foi bloqueada");
            window.location.replace("index.html");
        }

        async function iniciarGeracao() {
            const btn = document.getElementById('btnGerar');
            const loading = document.getElementById('loading');
            
            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Pega o IP
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                const ip = data.ip;
                const safeIp = ip.replace(/\./g, '_');
                
                await processarFirebase(safeIp, ip);
            } catch (error) {
                alert("Falha na conexão. Desative seu VPN ou Adblocker.");
                btn.style.display = 'flex';
                loading.style.display = 'none';
            }
        }

        async function processarFirebase(safeIp, realIp) {
            const loading = document.getElementById('loading');
            const keyArea = document.getElementById('keyArea');
            const txtKey = document.getElementById('txtKey');
            
            const tempoAtual = new Date().getTime();
            const validadeMs = 3600000; // 1 Hora

            try {
                const res = await fetch(`${dbUrl}/ips/${safeIp}.json`);
                const bancoDados = await res.json();

                if (bancoDados) {
                    // Verifica se já passou de 1 hora
                    if ((tempoAtual - bancoDados.timestamp) > validadeMs) {
                        await fetch(`${dbUrl}/ips/${safeIp}.json`, { method: 'DELETE' });
                        alert("Esta página expirou ou foi bloqueada (Sessão de 1h finalizada).");
                        window.location.replace("index.html");
                        return;
                    }

                    // Se a Key ainda for válida
                    loading.style.display = 'none';
                    keyArea.style.display = 'block';
                    txtKey.innerText = bancoDados.key;

                } else {
                    // Cria uma nova Key
                    const novaKey = "VORTEX-" + Math.random().toString(36).substring(2, 10).toUpperCase();
                    const registro = { ip: realIp, key: novaKey, timestamp: tempoAtual };

                    await fetch(`${dbUrl}/ips/${safeIp}.json`, {
                        method: 'PUT',
                        body: JSON.stringify(registro),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    loading.style.display = 'none';
                    keyArea.style.display = 'block';
                    txtKey.innerText = novaKey;
                }
            } catch (error) {
                alert("Erro ao validar no servidor Firebase.");
                window.location.replace("index.html");
            }
        }

        function copiarKey() {
            const keyText = document.getElementById('txtKey').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("Key copiada com sucesso!");
            }).catch(() => {
                alert("Erro ao copiar. Selecione manualmente.");
            });
        }
    </script>
</body>
</html>
