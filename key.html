<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Hub - Key System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            text-align: center;
            width: 350px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
            background: #0d0d0d;
            color: #fff;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #00ff88;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        button:hover {
            background: #00cc6a;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }
        .get-key-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
        }
        .get-key-btn:hover {
            background: #222;
            color: #fff;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>VORTEX HUB</h1>
        
        <!-- AQUI VAI ENTRAR O SEU SISTEMA ORIGINAL -->
        <div id="seu-sistema-aqui">
            <input type="text" id="keyInput" placeholder="Insira sua Key aqui...">
            <button onclick="verificarKey()">Verificar Key</button>
            <button class="get-key-btn" onclick="pegarKey()">Pegar Key</button>
        </div>
        
    </div>

    <script>
        // AGUARDANDO O SEU SCRIPT ORIGINAL PARA SUBSTITUIR ISSO AQUI
        function verificarKey() {
            console.log("Sistema original será inserido aqui.");
        }
        function pegarKey() {
            console.log("Link de pegar key original será inserido aqui.");
        }
    </script>
</body>
</html>
