<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX HUB - Liberar Acesso</title>
    <!-- Fonte parecida com a do painel do vídeo -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Fundo com grade estilo cibernético que aparece no vídeo */
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow: hidden;
        }

        .panel-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Avatar / Logo topo */
        .avatar {
            width: 80px;
            height: 80px;
            background: #111;
            border-radius: 50%;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            margin-bottom: 5px;
        }

        .online-status {
            font-size: 14px;
            color: #00ff00;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .title-section {
            font-size: 20px;
            font-weight: 700;
            color: #ffaa00;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Estilo dos Botões idêntico ao vídeo (bordas azuis, fundo escuro) */
        .btn-menu {
            width: 100%;
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #0055ff;
            color: #0088ff;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 85, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-menu:hover {
            background: rgba(0, 40, 80, 0.8);
            border-color: #00aaff;
            color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.4), inset 0 0 15px rgba(0, 170, 255, 0.4);
        }

        .btn-gerar {
            border: 2px solid #00d2ff;
            color: #00d2ff;
            background: rgba(0, 50, 100, 0.4);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            margin-bottom: 25px;
        }

        .btn-gerar:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 25px #00d2ff;
        }

        /* Área da Key Gerada */
        .key-result {
            display: none;
            width: 100%;
            background: rgba(0, 10, 20, 0.9);
            border: 1px solid #00ffaa;
            border-radius: 6px;
            padding: 15px;
            margin-top: -15px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
            text-align: left;
        }

        .key-result-title {
            color: #00ffaa;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 255, 170, 0.3);
            padding-bottom: 5px;
        }

        .key-info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 5px;
            font-family: monospace;
        }

        .key-info span {
            color: #fff;
            font-weight: bold;
        }

        .key-code {
            display: block;
            text-align: center;
            font-size: 22px;
            color: #00ffaa;
            margin: 15px 0;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ffaa;
        }

        .btn-copiar {
            background: transparent;
            border: 1px solid #00ffaa;
            color: #00ffaa;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-copiar:hover {
            background: #00ffaa;
            color: #000;
        }

        #loading {
            display: none;
            color: #00d2ff;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00d2ff;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <!-- Avatar e Nome -->
        <div class="avatar">🛡️</div>
        <div class="brand-name">VortexHub</div>
        
        <div class="online-status">
            <span class="dot"></span> USUÁRIOS ONLINE
        </div>

        <div class="title-section">
            🔓 LIBERAR ACESSO
        </div>

        <div id="loading">GERANDO KEY VORTEX...</div>

        <!-- Área onde a key gerada vai aparecer -->
        <div class="key-result" id="keyResultArea">
            <div class="key-result-title">KEY GERADA COM SUCESSO!</div>
            
            <div class="key-code" id="displayKey">VORTEX-XXXXX</div>
            
            <div class="key-info">IP: <span id="displayIp">...</span></div>
            <div class="key-info">VÁLIDA ATÉ: <span id="displayDate">...</span></div>
            <div class="key-info">STATUS: <span style="color: #00ffaa;">ONLINE E ATIVA</span></div>

            <button class="btn-copiar" onclick="copiarKey()">COPIAR KEY</button>
        </div>

        <!-- Botões do Menu iguais ao vídeo -->
        <button class="btn-menu btn-gerar" id="btnGerar" onclick="iniciarProcesso()">
            🔑 GERAR KEY VORTEX
        </button>

        <button class="btn-menu">⬇️ DOWNLOAD SCRIPT</button>
        <button class="btn-menu">📚 TUTORIAL SCRIPT</button>
        <button class="btn-menu">⏩ PASSADOR DE ENCURTADOR</button>
        <button class="btn-menu">📱 TUTORIAL ENCURTADOR</button>
        <button class="btn-menu" onclick="window.open('https://chat.whatsapp.com/SEULINK', '_blank')">💬 CANAL DO WHATSAPP</button>
    </div>

    <script>
        // CONFIGURAÇÕES
        const dbUrl = "https://sitevendas-26cf6-default-rtdb.firebaseio.com";
        const urlParams = new URLSearchParams(window.location.search);

        // 1. ANTI-LOCAL (CTRL+S)
        if (window.location.protocol === 'file:') {
            alert("Essa pagina foi bloqueada por tentativa de burlacão");
            window.location.replace("index.html");
        }

        // 2. ANTI-FAVORITOS
        if (!urlParams.get('auth')) {
            alert("Esta página expirou ou foi bloqueada");
            window.location.replace("index.html");
        }

        async function iniciarProcesso() {
            const btn = document.getElementById('btnGerar');
            const loading = document.getElementById('loading');
            
            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Pega IP
                const resIp = await fetch('https://api.ipify.org?format=json');
                const dataIp = await resIp.json();
                const ip = dataIp.ip;
                const safeIp = ip.replace(/\./g, '_');
                
                await verificarNoFirebase(safeIp, ip);
            } catch (error) {
                alert("Erro de conexão. Desative VPN ou AdBlock.");
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        async function verificarNoFirebase(safeIp, realIp) {
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('keyResultArea');
            const displayKey = document.getElementById('displayKey');
            const displayIp = document.getElementById('displayIp');
            const displayDate = document.getElementById('displayDate');
            
            const tempoAtual = new Date().getTime();
            const umaHoraEmMs = 3600000;

            try {
                const res = await fetch(`${dbUrl}/ips/${safeIp}.json`);
                const dados = await res.json();

                if (dados) {
                    const tempoPassado = tempoAtual - dados.timestamp;

                    if (tempoPassado > umaHoraEmMs) {
                        await fetch(`${dbUrl}/ips/${safeIp}.json`, { method: 'DELETE' });
                        alert("Esta página expirou ou foi bloqueada");
                        window.location.replace("index.html");
                        return;
                    }

                    // Calcula hora de expiração
                    const dataExp = new Date(dados.timestamp + umaHoraEmMs);
                    
                    loading.style.display = 'none';
                    resultArea.style.display = 'block';
                    displayKey.innerText = dados.key;
                    displayIp.innerText = realIp;
                    displayDate.innerText = formatarData(dataExp);

                } else {
                    // Gera nova
                    const novaKey = "VORTEX-" + Math.random().toString(36).substring(2, 10).toUpperCase();
                    const dataExp = new Date(tempoAtual + umaHoraEmMs);
                    
                    const novoRegistro = { ip: realIp, key: novaKey, timestamp: tempoAtual };

                    await fetch(`${dbUrl}/ips/${safeIp}.json`, {
                        method: 'PUT',
                        body: JSON.stringify(novoRegistro),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    loading.style.display = 'none';
                    resultArea.style.display = 'block';
                    displayKey.innerText = novaKey;
                    displayIp.innerText = realIp;
                    displayDate.innerText = formatarData(dataExp);
                }
            } catch (error) {
                alert("Erro ao contatar o servidor.");
                window.location.replace("index.html");
            }
        }

        function formatarData(data) {
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const ano = data.getFullYear();
            const hora = String(data.getHours()).padStart(2, '0');
            const min = String(data.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${ano} as ${hora}:${min}`;
        }

        function copiarKey() {
            const keyText = document.getElementById('displayKey').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("Key copiada para a área de transferência!");
            }).catch(() => {
                alert("Erro ao copiar. Selecione o texto manualmente.");
            });
        }
    </script>
</body>
</html>
