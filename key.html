<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--c:#00eaff;--p:#863cff;--g:#00ff91;--warn:#ff3366}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;background:radial-gradient(circle at 50% -15%,rgba(0,234,255,.18),transparent 35%),radial-gradient(circle at 100% 100%,rgba(134,60,255,.16),transparent 32%),#02050b;color:#fff;font-family:Orbitron,sans-serif}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,234,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.045) 1px,transparent 1px);background-size:40px 40px;animation:grid 10s linear infinite;pointer-events:none}@keyframes grid{to{background-position:0 40px,40px 0}}
.bg{position:fixed;border-radius:50%;filter:blur(100px);opacity:.14;pointer-events:none}.b1{width:400px;height:400px;background:var(--c);top:-250px;left:-150px}.b2{width:380px;height:380px;background:var(--p);right:-160px;bottom:-230px}
.particles{position:fixed;inset:0;pointer-events:none}.particle{position:absolute;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:up linear infinite}@keyframes up{from{transform:translateY(110vh);opacity:0}15%{opacity:.8}85%{opacity:.8}to{transform:translateY(-10vh);opacity:0}}
.card{position:relative;z-index:2;width:min(470px,100%);padding:1px;border-radius:27px;background:linear-gradient(135deg,rgba(0,234,255,.85),rgba(134,60,255,.7),transparent 70%);box-shadow:0 25px 90px #000,0 0 50px rgba(0,234,255,.08)}
.inner{position:relative;overflow:hidden;border-radius:26px;padding:31px 25px 22px;background:linear-gradient(145deg,rgba(7,18,33,.98),rgba(2,6,13,.99))}
.inner:after{content:"";position:absolute;inset:-80%;background:conic-gradient(from 90deg,transparent 0 72%,rgba(0,234,255,.055),transparent 78%);animation:spin 12s linear infinite;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}.content{position:relative;z-index:2}
.line{position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--c),var(--p),transparent);box-shadow:0 0 16px var(--c)}
.avatar{width:82px;height:82px;margin:auto;padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--p));box-shadow:0 0 30px rgba(0,234,255,.2);position:relative}.avatar:before{content:"";position:absolute;inset:-7px;border:1px solid rgba(0,234,255,.3);border-radius:50%;animation:spin 7s linear infinite}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #030912}
h1{text-align:center;margin-top:14px;font-size:25px;letter-spacing:3px;text-shadow:0 0 20px rgba(0,234,255,.4)}h1 span{color:var(--c)}.sub{text-align:center;margin-top:6px;color:#63758e;font-size:7px;letter-spacing:1.8px}
.status{width:max-content;margin:16px auto 13px;display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(0,255,145,.25);border-radius:99px;color:#4affa5;font-size:7px;letter-spacing:1px}.dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.keybox{padding:20px 13px;border:1px solid rgba(0,234,255,.35);border-radius:14px;background:linear-gradient(145deg,rgba(0,234,255,.055),rgba(134,60,255,.04));box-shadow:inset 0 0 25px rgba(0,234,255,.035),0 0 25px rgba(0,234,255,.05);text-align:center;position:relative;overflow:hidden}.keybox:before{content:"";position:absolute;top:0;left:-100%;width:70%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);animation:scan 3.5s infinite}@keyframes scan{0%,45%{left:-100%}70%,100%{left:140%}}.keylabel{position:relative;z-index:2;color:#52667f;font-size:6px;letter-spacing:1.5px;margin-bottom:8px}.key{position:relative;z-index:2;color:var(--c);font-size:18px;font-weight:900;letter-spacing:2px;word-break:break-all;text-shadow:0 0 15px rgba(0,234,255,.5)}
.btn{position:relative;width:100%;height:51px;margin-top:10px;border-radius:10px;border:1px solid var(--c);background:rgba(0,234,255,.05);color:#fff;font:800 9px Orbitron;letter-spacing:1px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(0,234,255,.18)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.stat{padding:12px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025)}.stat label{display:block;color:#50647d;font-size:6px;letter-spacing:1px}.stat b{display:block;margin-top:6px;color:var(--c);font-size:9px}.green b{color:var(--g)}.warn b{color:var(--warn)}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.social{height:44px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025);display:flex;align-items:center;justify-content:center;text-decoration:none;color:#9bacbf;font-size:7px;font-weight:800}.social:hover{color:#fff;border-color:rgba(0,234,255,.4)}
.footer{display:flex;justify-content:space-between;margin-top:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,.05);color:#405269;font-size:5.5px;letter-spacing:1px}.msg{text-align:center;min-height:16px;margin-top:9px;color:#4affa5;font-size:6.5px;letter-spacing:.6px}
.loading{display:flex;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;background:rgba(2,6,13,.78);backdrop-filter:blur(8px)}.loader{text-align:center}.ring{width:48px;height:48px;margin:auto;border:2px solid rgba(0,234,255,.12);border-top-color:var(--c);border-right-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}.loader p{margin-top:12px;color:#7890ab;font-size:7px;letter-spacing:1.3px}
@media(max-width:450px){.inner{padding:27px 16px 20px}.key{font-size:15px}.grid,.socials{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg b1"></div><div class="bg b2"></div><div class="particles" id="particles"></div>
<main class="card"><div class="inner"><div class="line"></div><div class="content">
<div class="avatar"><img src="https://github.com/ffvortex20-lgtm.png?size=256" alt="Vortex"></div>
<h1>VORTEX<span>HUB</span></h1><div class="sub">KEY GENERATION TERMINAL</div>
<div class="status"><span class="dot"></span>KEY READY</div>
<div class="keybox"><div class="keylabel">SUA VORTEX ACCESS KEY</div><div class="key" id="keyText">GERANDO...</div></div>
<button class="btn" id="copyBtn" onclick="copyKey()">⧉ COPIAR KEY</button>
<div class="msg" id="msg"></div>
<div class="grid">
<div class="stat green"><label>STATUS</label><b>ATIVA</b></div>
<div class="stat"><label>GERADA EM</label><b id="time">--</b></div>
<div class="stat warn"><label>EXPIRA EM</label><b id="countdown">Aguardando Cópia</b></div>
<div class="stat"><label>ORIGEM / IP</label><b id="country">--</b></div>
</div>
<div class="socials">
<a class="social" href="https://whatsapp.com/channel/0029Vb8TG8d6rsQq4XOiIa3N" target="_blank">💬 WHATSAPP</a>
<a class="social" href="https://t.me/vtxmdz" target="_blank">✈ TELEGRAM</a>
</div>
<div class="footer"><span>VORTEX HUB • v4.0</span><span>KEY SYSTEM</span></div>
</div>
<div class="loading" id="loading"><div class="loader"><div class="ring"></div><p>VERIFICANDO ACESSO...</p></div></div>
</div></main>
<script>
const SECRET_TOKEN = "vtx_auth";
const TIME_LIMIT = 20 * 60 * 1000;
const FIREBASE_URL = "https://vortexdev2-default-rtdb.firebaseio.com";[cite: 3]

const particles=document.getElementById("particles");
for(let i=0;i<48;i++){const p=document.createElement("i");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=5+Math.random()*10+"s";p.style.animationDelay=-Math.random()*10+"s";const s=1+Math.random()*2;p.style.width=s+"px";p.style.height=s+"px";particles.appendChild(p)}

function randomKey(){const a=new Uint8Array(12);crypto.getRandomValues(a);const s=Array.from(a,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();return "VTX-"+s.slice(0,6)+"-"+s.slice(6,12)+"-"+s.slice(12,18)+"-"+s.slice(18,24)}

let activeTimer = null;

function startCountdown(expireTime) {
    if (activeTimer) clearInterval(activeTimer);
    activeTimer = setInterval(() => {
        const now = new Date().getTime();
        const distance = expireTime - now;

        if (distance < 0) {
            clearInterval(activeTimer);
            localStorage.removeItem("vtx_session");
            localStorage.removeItem("vtx_authorized");
            alert("Sua Key expirou! Você precisa passar pelo encurtador novamente.");
            window.location.href = "index.html";
            return;
        }

        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById("countdown").textContent = `${minutes}m ${seconds}s`;
    }, 1000);
}

async function verifyAndLoadKey() {
    document.getElementById("loading").style.display="flex";
    
    const urlParams = new URLSearchParams(window.location.search);
    const hasValidToken = urlParams.get('token') === SECRET_TOKEN;
    const isAuthorized = localStorage.getItem('vtx_authorized') === 'true';
    const savedIp = localStorage.getItem('vtx_client_ip');
    
    const sessionData = JSON.parse(localStorage.getItem('vtx_session'));
    const now = new Date().getTime();

    const currentIpData = await fetch("https://ipapi.co/json/").then(r=>r.json()).catch(()=>null);
    const currentIp = currentIpData?.ip || "unknown";
    const country = currentIpData?.country_code || "N/D";

    if (hasValidToken && isAuthorized) {
        if (savedIp && savedIp !== "unknown" && currentIp !== "unknown" && savedIp !== currentIp) {
            alert("Acesso negado: IP divergente do que iniciou a sessão!");
            window.location.href = "index.html";
            return;
        }

        const newKey = randomKey();
        const generatedAt = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        const valTimestamp = String(now + (24 * 60 * 60 * 1000));

        try {
            const userData = {
                user: newKey,
                pass: newKey,
                val: valTimestamp,
                status: "on",
                disp: "",
                login: 1,
                childkey: ""
            };

            const response = await fetch(`${FIREBASE_URL}/Users.json`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(userData)
            });
            const result = await response.json();
            
            if (result && result.name) {
                await fetch(`${FIREBASE_URL}/Users/${result.name}.json`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ childkey: result.name })
                });
            }
        } catch (err) {
            console.error("Erro ao salvar no Firebase:", err);
        }

        await new Promise(r=>setTimeout(r,850));

        const session = { key: newKey, generatedAt, country, expireTime: null };
        localStorage.setItem('vtx_session', JSON.stringify(session));
        localStorage.removeItem('vtx_authorized');

        document.getElementById("keyText").textContent = newKey;
        document.getElementById("time").textContent = generatedAt;
        document.getElementById("country").textContent = country;
        document.getElementById("msg").textContent = "KEY GERADA COM SUCESSO";
        
        document.getElementById("loading").style.display="none";
        window.history.replaceState({}, document.title, window.location.pathname);
        return;
    }

    if (sessionData) {
        if (sessionData.expireTime && sessionData.expireTime < now) {
            localStorage.removeItem("vtx_session");
            alert("Sua Key expirou! Você precisa passar pelo encurtador novamente.");
            window.location.href = "index.html";
            return;
        }

        document.getElementById("keyText").textContent = sessionData.key;
        document.getElementById("time").textContent = sessionData.generatedAt;
        document.getElementById("country").textContent = sessionData.country;
        
        if (sessionData.expireTime) {
            document.getElementById("msg").textContent = "SESSÃO ATIVA";
            startCountdown(sessionData.expireTime);
        } else {
            document.getElementById("msg").textContent = "AGUARDANDO CÓPIA";
        }

        document.getElementById("loading").style.display="none";
        return;
    }

    alert("Acesso negado! Por favor, passe pelo encurtador primeiro.");
    window.location.href = "index.html";
}

function triggerSuccess() {
    document.getElementById("msg").textContent = "KEY COPIADA COM SUCESSO";
    let sessionData = JSON.parse(localStorage.getItem('vtx_session'));
    if (sessionData && !sessionData.expireTime) {
        const expireTime = new Date().getTime() + TIME_LIMIT;
        sessionData.expireTime = expireTime;
        localStorage.setItem('vtx_session', JSON.stringify(sessionData));
        startCountdown(expireTime);
    }
}

function copyKey(){
    const k = document.getElementById("keyText").textContent;
    if(!k || k === "GERANDO...") return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(k).then(() => {
            triggerSuccess();
        }).catch(() => {
            fallbackCopy(k);
        });
    } else {
        fallbackCopy(k);
    }
}

function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) {
            triggerSuccess();
        } else {
            document.getElementById("msg").textContent = "NÃO FOI POSSÍVEL COPIAR";
        }
    } catch (err) {
        document.body.removeChild(textArea);
        document.getElementById("msg").textContent = "NÃO FOI POSSÍVEL COPIAR";
    }
}

verifyAndLoadKey();
</script>
</body>
