
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexSub - Verificação de Tarefas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-color: #0b0f19; --card-bg: #111827; --border-color: #1f2937; 
            --text-main: #f9fafb; --text-muted: #9ca3af; --primary: #ffffff; 
            --primary-hover: #e5e7eb; --accent: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, rgba(31, 41, 55, 0.4) 0%, transparent 60%);
        }
        .container { width: 100%; max-width: 480px; }
        .card { 
            background-color: var(--card-bg); border: 1px solid var(--border-color); 
            border-radius: 16px; padding: 32px 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center;
        }
        .camp-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
        .camp-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        
        .progress-container { margin-bottom: 24px; text-align: left; }
        .progress-info { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s ease; }

        .task-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; text-align: left; }
        .task-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); 
            border-radius: 12px; padding: 14px 16px; transition: all 0.3s ease; cursor: pointer;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); }
        .task-item.completed { border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); }
        .task-item.warning { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.05); }
        
        .task-left { display: flex; align-items: center; gap: 12px; }
        .task-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text-main); }
        .task-item.completed .task-icon { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .task-item.warning .task-icon { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        
        .task-name { font-size: 14px; font-weight: 600; color: var(--text-main); display: block; }
        .task-desc { font-size: 11px; color: var(--text-muted); }
        
        .toast-msg {
            font-size: 11px; color: var(--warning); margin-top: 4px; font-weight: 500; display: none;
        }

        .btn-main { 
            width: 100%; background-color: var(--primary); border: none; border-radius: 10px; 
            padding: 14px; color: #000; font-weight: 600; font-size: 14px; cursor: pointer; 
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
            opacity: 0.5; pointer-events: none; box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }
        .btn-main.unlocked { opacity: 1; pointer-events: auto; }
        .btn-main:hover { background-color: var(--primary-hover); }
        .footer-brand { margin-top: 24px; font-size: 11px; color: var(--text-muted); text-align: center; }
        .footer-brand span { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <div id="loadingView">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; color: var(--text-muted); margin-bottom: 12px;"></i>
                <p style="font-size: 14px; color: var(--text-muted);">Carregando campanha...</p>
            </div>
            <div id="contentView" style="display: none;">
                <h1 class="camp-title" id="campTitleDisplay">Carregando...</h1>
                <p class="camp-subtitle">Complete as tarefas abaixo para liberar o link.</p>
                
                <div class="progress-container">
                    <div class="progress-info"><span id="progressText">0 de 0 ações completas</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
                </div>

                <div class="task-list" id="taskListContainer"></div>

                <button class="btn-main" id="finalBtn" onclick="goToTarget()">
                    <i class="fa-solid fa-unlock-keyhole"></i> LIBERAR LINK FINAL
                </button>
            </div>
            <div id="pausedView" style="display: none;" class="paused-box">
                <i class="fa-solid fa-circle-exclamation" style="font-size: 36px; color: var(--accent); margin-bottom: 12px;"></i>
                <h3 style="font-size: 18px; margin-bottom: 6px;">Campanha Pausada</h3>
                <p style="font-size: 13px; color: var(--text-muted);">Esta campanha foi pausada pelo criador.</p>
            </div>
        </div>
        <div class="footer-brand">Powered by <span>VortexSub</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, get, update, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACGn5I--vTEmJ6eijN2lytZiMgo2ElnW4",
            authDomain: "vortexdev2.firebaseapp.com",
            databaseURL: "https://vortexdev2-default-rtdb.firebaseio.com",
            projectId: "vortexdev2",
            storageBucket: "vortexdev2.firebasestorage.app",
            messagingSenderId: "755839099190",
            appId: "1:755839099190:android:f97e6d0dc860177306d397"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const campId = urlParams.get('id');
        let targetUrlFinal = "";
        let completedTasks = new Set();
        let totalTasksCount = 0;
        let pendingVerification = null;
        let clickTimestamp = 0;

        async function loadCampaign() {
            if (!campId) return;
            const snap = await get(child(ref(db), 'campaigns/' + campId));
            if (!snap.exists()) return;
            const camp = snap.val();

            if (camp.status === 'paused') {
                document.getElementById('loadingView').style.display = 'none';
                document.getElementById('pausedView').style.display = 'block';
                return;
            }

            document.getElementById('campTitleDisplay').innerText = camp.title;
            targetUrlFinal = camp.targetUrl;
            totalTasksCount = camp.tasks ? camp.tasks.length : 0;

            const listContainer = document.getElementById('taskListContainer');
            listContainer.innerHTML = '';

            camp.tasks.forEach((task, index) => {
                let label = "Acessar Link";
                let icon = "fa-link";
                if(task.type === 'whatsapp') { label = "Entrar no WhatsApp"; icon = "fa-whatsapp"; }
                else if(task.type === 'telegram') { label = "Entrar no Telegram"; icon = "fa-telegram"; }
                else if(task.type === 'youtube') { label = "Inscrever-se no canal"; icon = "fa-youtube"; }

                listContainer.innerHTML += `
                    <div class="task-item" id="task-${index}" onclick="startTask(${index}, '${task.url}')">
                        <div class="task-left">
                            <div class="task-icon"><i class="fa-brands ${icon}"></i></div>
                            <div>
                                <span class="task-name">${label}</span>
                                <span class="task-desc" id="desc-${index}">Clique para realizar a tarefa</span>
                                <span class="toast-msg" id="toast-${index}"><i class="fa-solid fa-triangle-exclamation"></i> Você voltou muito rápido! Conclua a tarefa.</span>
                            </div>
                        </div>
                        <div class="task-status-icon"><i class="fa-solid fa-chevron-right" id="icon-${index}"></i></div>
                    </div>
                `;
            });

            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('contentView').style.display = 'block';
        }

        window.startTask = function(index, url) {
            if (completedTasks.has(index)) return;
            window.open(url, '_blank');
            clickTimestamp = Date.now();
            pendingVerification = index;

            const icon = document.getElementById(`icon-${index}`);
            icon.className = "fa-solid fa-spinner fa-spin";
            document.getElementById(`desc-${index}`).innerText = "Verificando conclusão...";
        }

        // Checker ao focar novamente na aba
        window.addEventListener('focus', () => {
            if (pendingVerification !== null) {
                const elapsed = Date.now() - clickTimestamp;
                const index = pendingVerification;
                pendingVerification = null;
                const item = document.getElementById(`task-${index}`);
                const icon = document.getElementById(`icon-${index}`);
                const desc = document.getElementById(`desc-${index}`);
                const toast = document.getElementById(`toast-${index}`);

                // Se voltar em menos de 4 segundos, rejeita e avisa
                if (elapsed < 4000) {
                    item.classList.add('warning');
                    icon.className = "fa-solid fa-triangle-exclamation";
                    icon.style.color = "var(--warning)";
                    desc.style.display = "none";
                    toast.style.display = "block";
                    setTimeout(() => {
                        item.classList.remove('warning');
                        icon.className = "fa-solid fa-chevron-right";
                        icon.style.color = "";
                        desc.style.display = "block";
                        toast.style.display = "none";
                        desc.innerText = "Clique para realizar a tarefa";
                    }, 4000);
                } else {
                    completedTasks.add(index);
                    item.classList.add('completed');
                    icon.className = "fa-solid fa-check";
                    desc.innerText = "Concluído com sucesso!";
                    updateProgress();
                }
            }
        });

        function updateProgress() {
            const count = completedTasks.size;
            document.getElementById('progressText').innerText = `${count} de ${totalTasksCount} ações completas`;
            document.getElementById('progressBarFill').style.width = `${(count / totalTasksCount) * 100}%`;
            if (count === totalTasksCount) document.getElementById('finalBtn').classList.add('unlocked');
        }

        window.goToTarget = function() { if (targetUrlFinal) window.location.href = targetUrlFinal; }
        loadCampaign();
    </script>
</body>
</html>
