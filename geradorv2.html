<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM TEAM - Acesso Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #050508;
        --surface: #0e0e14;
        --surface-glass: rgba(14, 14, 20, 0.82);
        --border: rgba(255, 23, 68, 0.2);
        --border-glow: rgba(255, 23, 68, 0.4);
        
        --primary: #ff1744;
        --primary-glow: rgba(255, 23, 68, 0.3);
        --accent: #ff5473;
        
        --text-main: #ffffff;
        --text-sub: #94a3b8;
        --text-dim: #64748b;
        
        --success: #10b981;
        --warning: #f59e0b;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* Fundo com Ondas Animadas */
    .wave-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: 0.4;
    }

    .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" fill="%23ff1744" opacity="0.12"/></svg>');
        background-repeat: repeat-x;
        background-position: 0 bottom;
        animation: waveAnimation 18s linear infinite;
    }

    .wave:nth-child(2) {
        bottom: 10px;
        opacity: 0.08;
        animation: waveAnimation 12s linear infinite reverse;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,30 C200,100 400,0 600,50 C800,100 1000,10 1200,40 L1200,120 L0,120 Z" fill="%23ff5473" opacity="0.15"/></svg>');
    }

    @keyframes waveAnimation {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* Ambient Glow & Particles */
    .ambient-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 0;
        pointer-events: none;
        background: rgba(255, 23, 68, 0.12);
        animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
        from { transform: scale(1); opacity: 0.1; }
        to { transform: scale(1.2); opacity: 0.2; }
    }

    .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    .particle {
        position: absolute;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0.4;
        box-shadow: 0 0 10px var(--primary);
        animation: floatUp linear infinite;
    }
    @keyframes floatUp {
        0% { transform: translateY(105vh) scale(0); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(-5vh) scale(1); opacity: 0; }
    }

    /* Main Container */
    .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
    }

    .card {
        background: var(--surface-glass);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 23, 68, 0.1);
        position: relative;
        overflow: hidden;
        animation: cardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes cardEnter {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 23, 68, 0.5), transparent);
    }

    /* Header Profile / Logo */
    .header-box {
        text-align: center;
        margin-bottom: 20px;
    }

    .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(145deg, #ff1744, #a9002d);
        color: #fff;
        box-shadow: 0 0 35px rgba(255, 23, 68, 0.4), inset 0 1px rgba(255, 255, 255, 0.3);
        animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
        0%, 100% { box-shadow: 0 0 25px rgba(255, 23, 68, 0.25); }
        50% { box-shadow: 0 0 50px rgba(255, 23, 68, 0.6); }
    }

    .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .title span {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 12px;
        color: var(--text-dim);
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 20px;
    }

    /* Input Grupo de Chave */
    .input-group {
        position: relative;
        margin-bottom: 14px;
    }

    .key-input {
        width: 100%;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 90px 16px 16px;
        color: #fff;
        font-size: 14px;
        font-family: monospace;
        letter-spacing: 1px;
        outline: none;
        transition: all 0.3s;
    }

    .key-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
    }

    .btn-action-input {
        position: absolute;
        right: 6px;
        top: 6px;
        bottom: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-action-input:hover {
        background: var(--primary);
        border-color: var(--primary);
    }

    /* Botão Principal */
    .btn-main {
        position: relative;
        overflow: hidden;
        width: 100%;
        background: linear-gradient(135deg, #ff1744, #d50036);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 15px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 6px 20px rgba(255, 23, 68, 0.35);
        margin-bottom: 10px;
    }

    .btn-main:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 23, 68, 0.55);
    }

    .btn-main:active {
        transform: scale(0.97);
    }

    .btn-secondary {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        box-shadow: none;
    }

    .btn-secondary:hover {
        background: rgba(255, 23, 68, 0.08);
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.15);
    }

    .msg {
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--success);
        min-height: 18px;
        margin-top: 8px;
        margin-bottom: 8px;
    }

    .info {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--text-dim);
        font-size: 11px;
        line-height: 1.6;
        text-align: center;
    }

    .info b {
        color: var(--text-sub);
    }

    .hidden {
        display: none !important;
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 10px;
        color: var(--text-dim);
        letter-spacing: 1px;
        font-weight: 600;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<!-- Ondas e Fundo Animado -->
<div class="wave-background">
    <div class="wave"></div>
    <div class="wave"></div>
</div>
<div class="ambient-glow"></div>
<div class="particles" id="particles"></div>

<div class="container">
    <!-- Tela Principal / Inserir Key -->
    <div id="main-view" class="card">
        <div class="header-box">
            <div class="logo">VM</div>
            <h1 class="title">VM TEAM <span>WIRE</span></h1>
            <div class="subtitle">Acesso Online</div>
        </div>

        <div class="input-group">
            <input type="password" id="keyInput" class="key-input" placeholder="Digite ou cole sua key..." />
            <button class="btn-action-input" onclick="pasteKey()">Colar</button>
        </div>

        <button class="btn-main" onclick="validateKey()">
            ENTRAR
        </button>

        <button class="btn-main btn-secondary" onclick="goToGetKey()">
            GET KEY
        </button>

        <div class="msg" id="msg"></div>

        <div class="info">
            Serviço disponível • Validade inicia no primeiro acesso.<br>
            <b>A licença é ativada no primeiro acesso. Os dias começam a contar após a ativação.</b>
        </div>

        <div class="footer">
            Developed by VM Team
        </div>
    </div>

    <!-- Tela de Manutenção (Opcional caso precise ativar) -->
    <div id="maintenance-view" class="card hidden" style="text-align: center;">
        <div style="font-size: 32px; margin-bottom: 12px;">⚙</div>
        <h1 class="title" style="color: var(--primary);">Em manutenção</h1>
        <div class="subtitle" style="margin-top: 8px;">
            Nosso sistema está temporariamente indisponível.<br><br>Tente novamente mais tarde.
        </div>
    </div>
</div>

<script>
const FIREBASE_URL = "https://vmteam-fcb3e-default-rtdb.firebaseio.com";

// Sistema de Som Dinâmico (Web Audio API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClickSound() {
    try {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

// Criar partículas de fundo
const particlesContainer = document.getElementById("particles");
for(let i = 0; i < 25; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (6 + Math.random() * 8) + "s";
    p.style.animationDelay = -(Math.random() * 10) + "s";
    const size = (2 + Math.random() * 3) + "px";
    p.style.width = size;
    p.style.height = size;
    particlesContainer.appendChild(p);
}

function pasteKey() {
    playClickSound();
    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(text => {
            document.getElementById("keyInput").value = text.trim();
        }).catch(() => {});
    }
}

function goToGetKey() {
    playClickSound();
    window.location.href = "key.html";
}

async function validateKey() {
    playClickSound();
    const inputKey = document.getElementById("keyInput").value.trim();
    const msgEl = document.getElementById("msg");

    if (!inputKey) {
        msgEl.style.color = "var(--warning)";
        msgEl.textContent = "DIGITE UMA CHAVE VÁLIDA";
        return;
    }

    msgEl.style.color = "var(--text-sub)";
    msgEl.textContent = "VERIFICANDO NO SERVIDOR...";

    try {
        // Busca na nova Firebase
        const res = await fetch(`${FIREBASE_URL}/KeysUsers.json`);
        if (!res.ok) throw new Error("Erro de conexão");

        const data = await res.json();
        let found = false;

        if (data) {
            for (let uid in data) {
                if (data[uid].key === inputKey) {
                    found = true;
                    break;
                }
            }
        }

        if (found) {
            msgEl.style.color = "var(--success)";
            msgEl.textContent = "LICENÇA AUTORIZADA COM SUCESSO!";
            localStorage.setItem("vm_active_key", inputKey);
            setTimeout(() => {
                // Aqui você pode redirecionar para o painel principal do app/web
                alert("Acesso liberado!");
            }, 1000);
        } else {
            msgEl.style.color = "var(--primary)";
            msgEl.textContent = "CHAVE INVÁLIDA OU EXPIRADA";
        }
    } catch (e) {
        msgEl.style.color = "var(--primary)";
        msgEl.textContent = "ERRO AO CONECTAR AO SERVIDOR";
    }
}

// Checar se já existe sessão salva
window.addEventListener("DOMContentLoaded", () => {
    const savedKey = localStorage.getItem("vm_active_key");
    if (savedKey) {
        document.getElementById("keyInput").value = savedKey;
    }
});
</script>
</body>
</html>
