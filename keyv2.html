<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM TEAM - GetKey Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #050508;
        --surface: #0e0e14;
        --surface-glass: rgba(14, 14, 20, 0.82);
        --border: rgba(255, 23, 68, 0.2);
        --border-glow: rgba(255, 23, 68, 0.4);
        
        --primary: #ff1744;
        --primary-glow: rgba(255, 23, 68, 0.3);
        --accent: #ff5473;
        
        --text-main: #ffffff;
        --text-sub: #94a3b8;
        --text-dim: #64748b;
        
        --success: #10b981;
        --warning: #f59e0b;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* Fundo com Ondas Animadas */
    .wave-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: 0.4;
    }

    .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" fill="%23ff1744" opacity="0.12"/></svg>');
        background-repeat: repeat-x;
        background-position: 0 bottom;
        animation: waveAnimation 18s linear infinite;
    }

    .wave:nth-child(2) {
        bottom: 10px;
        opacity: 0.08;
        animation: waveAnimation 12s linear infinite reverse;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,30 C200,100 400,0 600,50 C800,100 1000,10 1200,40 L1200,120 L0,120 Z" fill="%23ff5473" opacity="0.15"/></svg>');
    }

    @keyframes waveAnimation {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* Ambient Glow & Particles */
    .ambient-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 0;
        pointer-events: none;
        background: rgba(255, 23, 68, 0.12);
        animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
        from { transform: scale(1); opacity: 0.1; }
        to { transform: scale(1.2); opacity: 0.2; }
    }

    .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    .particle {
        position: absolute;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0.4;
        box-shadow: 0 0 10px var(--primary);
        animation: floatUp linear infinite;
    }
    @keyframes floatUp {
        0% { transform: translateY(105vh) scale(0); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(-5vh) scale(1); opacity: 0; }
    }

    /* Main Container */
    .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
    }

    .card {
        background: var(--surface-glass);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 23, 68, 0.1);
        position: relative;
        overflow: hidden;
        animation: cardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes cardEnter {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 23, 68, 0.5), transparent);
    }

    /* Header Profile / Logo */
    .header-box {
        text-align: center;
        margin-bottom: 20px;
    }

    .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(145deg, #ff1744, #a9002d);
        color: #fff;
        box-shadow: 0 0 35px rgba(255, 23, 68, 0.4), inset 0 1px rgba(255, 255, 255, 0.3);
        animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
        0%, 100% { box-shadow: 0 0 25px rgba(255, 23, 68, 0.25); }
        50% { box-shadow: 0 0 50px rgba(255, 23, 68, 0.6); }
    }

    .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .title span {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 12px;
        color: var(--text-dim);
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    /* Status Pill */
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        padding: 6px 12px;
        border-radius: 30px;
        font-size: 11px;
        font-weight: 600;
        color: var(--success);
        margin-bottom: 20px;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--success);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--success);
        animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Key Box Display */
    .key-container {
        background: rgba(0, 0, 0, 0.5);
        border: 1px dashed rgba(255, 23, 68, 0.5);
        border-radius: 16px;
        padding: 18px;
        text-align: center;
        margin-bottom: 16px;
        position: relative;
        transition: all 0.3s;
    }

    .key-container:hover {
        border-color: var(--primary);
        box-shadow: 0 0 25px rgba(255, 23, 68, 0.15);
    }

    .key-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-dim);
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .key-value {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
        font-family: monospace;
        letter-spacing: 1.5px;
        word-break: break-all;
    }

    /* Action Button */
    .btn-main {
        position: relative;
        overflow: hidden;
        width: 100%;
        background: linear-gradient(135deg, #ff1744, #d50036);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 15px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 6px 20px rgba(255, 23, 68, 0.35);
    }

    .btn-main:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 23, 68, 0.55);
    }

    .btn-main:active {
        transform: scale(0.97);
    }

    .btn-main::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transform: skewX(-20deg);
    }

    .btn-main:hover::before {
        animation: shine 0.7s;
    }

    @keyframes shine {
        to { left: 140%; }
    }

    .msg {
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--success);
        min-height: 18px;
        margin-top: 10px;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 16px;
    }

    .stat-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        text-align: left;
    }

    .stat-card span {
        display: block;
        font-size: 10px;
        color: var(--text-dim);
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .stat-card strong {
        font-size: 12px;
        color: var(--text-sub);
        font-weight: 700;
    }

    .stat-card.highlight strong {
        color: var(--warning);
    }

    /* Social Links */
    .social-btn {
        margin-top: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        color: var(--text-sub);
        font-size: 11px;
        font-weight: 600;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .social-btn:hover {
        background: rgba(255, 23, 68, 0.08);
        color: var(--text-main);
        border-color: var(--primary);
    }

    /* Footer */
    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 10px;
        color: var(--text-dim);
        letter-spacing: 1px;
        font-weight: 600;
        text-transform: uppercase;
    }

    /* Loading Overlay */
    .loading {
        position: fixed;
        inset: 0;
        background: var(--bg-deep);
        z-index: 99;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 0.3s ease;
    }

    .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.05);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-bottom: 12px;
    }

    .loading p {
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 1.5px;
        font-weight: 700;
        text-transform: uppercase;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>
<body>

<!-- Ondas e Fundo Animado -->
<div class="wave-background">
    <div class="wave"></div>
    <div class="wave"></div>
</div>
<div class="ambient-glow"></div>
<div class="particles" id="particles"></div>

<div class="container">
    <div class="card">
        <div class="header-box">
            <div class="logo">VM</div>
            <h1 class="title">VM TEAM <span>KEY</span></h1>
            <div class="subtitle">Secure Key Terminal</div>
        </div>

        <div style="text-align: center;">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>SISTEMA ATIVO (24H AUTO-CLEAN)</span>
            </div>
        </div>

        <div class="key-container">
            <div class="key-label">Sua Chave de Acesso</div>
            <div class="key-value" id="keyText">GERANDO...</div>
        </div>

        <button class="btn-main" id="copyBtn" onclick="copyKey()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copiar Key
        </button>
        <div class="msg" id="msg"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Gerada em</span>
                <strong id="time">--:--</strong>
            </div>
            <div class="stat-card highlight">
                <span>Expira em</span>
                <strong id="countdown">Calculando...</strong>
            </div>
            <div class="stat-card">
                <span>Seu IP</span>
                <strong id="userIp">Carregando...</strong>
            </div>
            <div class="stat-card">
                <span>Status ID</span>
                <strong style="color: var(--success)">Ativada</strong>
            </div>
        </div>

        <a href="https://t.me/vtxmdz" target="_blank" class="social-btn" onclick="playClickSound()">
            📢 Canal de Atualizações / Telegram
        </a>

        <div class="footer">
            Developed by VM Team
        </div>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">CONECTANDO AO SERVIDOR...</p>
</div>

<script>
const ONE_DAY_MS = 24 * 60 * 60 * 1000; 
const FIREBASE_URL = "https://vmteam-fcb3e-default-rtdb.firebaseio.com";

// Sistema de Som Dinâmico (Web Audio API - Sem arquivos externos)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClickSound() {
    try {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

function setLoadMsg(msg) {
    const el = document.getElementById("loadingText");
    if(el) el.textContent = msg;
}

// Criar partículas suaves no fundo
const particlesContainer = document.getElementById("particles");
for(let i = 0; i < 25; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (6 + Math.random() * 8) + "s";
    p.style.animationDelay = -(Math.random() * 10) + "s";
    const size = (2 + Math.random() * 3) + "px";
    p.style.width = size;
    p.style.height = size;
    particlesContainer.appendChild(p);
}

function generateFirebaseUID() {
    const chars = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
    let uid = '';
    for (let i = 0; i < 20; i++) {
        uid += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return uid;
}

function generateKey(){
    const digits = Math.floor(1000 + Math.random() * 9000); 
    return `VM-VIP-${digits}`;
}

let activeTimer = null;

function startCountdown(expireTime) {
    if (activeTimer) clearInterval(activeTimer);
    activeTimer = setInterval(() => {
        const now = new Date().getTime();
        const distance = expireTime - now;

        if (distance < 0) {
            clearInterval(activeTimer);
            localStorage.removeItem("vm_session_v1");
            window.location.reload();
            return;
        }

        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        document.getElementById("countdown").textContent = `${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
}

function hideLoading() {
    const loader = document.getElementById("loading");
    if (loader) {
        loader.style.opacity = "0";
        setTimeout(() => loader.style.display = "none", 300);
    }
}

async function getIpAndValidate() {
    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        const rawIp = ipData.ip;
        const ipKey = rawIp.replace(/[.#$[\]]/g, "_");
        document.getElementById("userIp").textContent = rawIp;

        // Verificar trava por IP no Firebase
        const lockRes = await fetch(`${FIREBASE_URL}/visitas/ips/${ipKey}.json`);
        if (lockRes.ok) {
            const lockData = await lockRes.json();
            const now = new Date().getTime();

            // Sistema de expiração automática em 24h (limpa se passou do tempo)
            if (lockData && lockData.expireTime && lockData.expireTime > now) {
                document.getElementById("keyText").textContent = lockData.key;
                document.getElementById("time").textContent = lockData.generatedAt;
                startCountdown(lockData.expireTime);
                hideLoading();

                localStorage.setItem('vm_session_v1', JSON.stringify({
                    key: lockData.key,
                    generatedAt: lockData.generatedAt,
                    ip: rawIp,
                    expireTime: lockData.expireTime,
                    uid: lockData.uid
                }));
                return null; 
            } else if (lockData && lockData.uid) {
                // Se expirou as 24h, apaga automaticamente do Firebase para não acumular lixo
                await fetch(`${FIREBASE_URL}/visitas/ips/${ipKey}.json`, { method: "DELETE" });
                await fetch(`${FIREBASE_URL}/KeysUsers/${lockData.uid}.json`, { method: "DELETE" });
            }
        }
        return { rawIp, ipKey };
    } catch(e) { 
        document.getElementById("userIp").textContent = "DESCONHECIDO";
        return { rawIp: "Local", ipKey: "IP_LOCAL_" + Math.floor(Math.random() * 1000) }; 
    }
}

async function verifyAndLoadKey() {
    try {
        const now = new Date().getTime();
        const sessionData = JSON.parse(localStorage.getItem('vm_session_v1') || "null");
        
        if (sessionData && sessionData.expireTime > now) {
            document.getElementById("keyText").textContent = sessionData.key;
            document.getElementById("time").textContent = sessionData.generatedAt || "--";
            document.getElementById("userIp").textContent = sessionData.ip || "Local";
            startCountdown(sessionData.expireTime);
            hideLoading();
            return; 
        }

        setLoadMsg("OBTENDO SEU IP...");
        const ipResult = await getIpAndValidate();
        if (!ipResult) return; 

        const { rawIp, ipKey } = ipResult;

        setLoadMsg("GERANDO NOVA KEY...");
        const newKey = generateKey();
        const UID = generateFirebaseUID(); 
        const generatedAt = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        const expireTime = now + ONE_DAY_MS;

        const payloadData = {
            key: newKey,
            validade: "1",
            dispositivos: "1",
            device: "",
            status: "ativada",
            dias: "0",
            uid: UID,
            expireTime: expireTime
        };

        // Salvar chave do usuário na nova Firebase
        await fetch(`${FIREBASE_URL}/KeysUsers/${UID}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payloadData)
        });

        // Registrar IP com expiração vinculada para apagar após 24h
        await fetch(`${FIREBASE_URL}/visitas/ips/${ipKey}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: newKey, expireTime, generatedAt, uid: UID })
        }).catch(e => console.log("Erro ao salvar trava IP:", e));

        localStorage.setItem('vm_session_v1', JSON.stringify({
            key: newKey,
            generatedAt,
            ip: rawIp,
            expireTime,
            uid: UID
        }));

        document.getElementById("keyText").textContent = newKey;
        document.getElementById("time").textContent = generatedAt;
        document.getElementById("msg").textContent = "KEY REGISTRADA COM SUCESSO";
        
        startCountdown(expireTime);
        hideLoading();

    } catch (e) {
        setLoadMsg("ERRO AO CONECTAR");
        setTimeout(hideLoading, 1500);
    }
}

function triggerSuccess() {
    playClickSound();
    document.getElementById("msg").textContent = "KEY COPIADA COM SUCESSO!";
    setTimeout(() => {
        document.getElementById("msg").textContent = "";
    }, 3000);
}

function copyKey(){
    playClickSound();
    const k = document.getElementById("keyText").textContent;
    if(!k || k === "GERANDO..." || k === "ERRO AO CONECTAR") return;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(k).then(triggerSuccess).catch(() => fallbackCopy(k));
    } else {
        fallbackCopy(k);
    }
}

function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        if (document.execCommand('copy')) triggerSuccess();
    } catch (err) {}
    document.body.removeChild(textArea);
}

verifyAndLoadKey();
</script>
</body>
</html>
