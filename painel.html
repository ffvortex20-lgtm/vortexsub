<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - VortexSub</title>
    <link rel="stylesheet" href="css/painel.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>VortexSub</h2>
            </div>
            <nav>
                <a href="#" class="nav-item active">Criar campanha</a>
            </nav>
        </aside>

        <main class="content">
            <section class="tab-content active">
                <h2>Criar campanha</h2>
                <p>Configure o link de destino e salve diretamente no banco de dados.</p>

                <div class="form-group">
                    <label>URL de destino (Link que será liberado)*</label>
                    <input type="text" id="linkDestino" placeholder="https://seu-link-aqui.com">
                </div>

                <div class="form-group">
                    <label>Título da Campanha*</label>
                    <input type="text" id="tituloCampanha" placeholder="Ex: Baixar E-book Grátis">
                </div>

                <div class="form-group">
                    <label>Descrição (Opcional)</label>
                    <textarea id="descricaoCampanha" placeholder="Instruções para o usuário..."></textarea>
                </div>

                <button class="btn-principal" id="btnPublicar">Criar e Salvar Campanha</button>
            </section>
        </main>
    </div>

    <script type="module" src="js/painel.js"></script>
</body>
</html>
