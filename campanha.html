<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desbloquear Link - VortexSub</title>
    <link rel="stylesheet" href="css/campanha.css">
</head>
<body>
    <div class="container-campanha">
        <div class="card-box">
            <h1 id="tituloExibicao">Carregando Campanha...</h1>
            <p id="descricaoExibicao">Complete a etapa abaixo para liberar o seu acesso.</p>

            <div class="etapa-box" onclick="concluirEtapa(this)">
                <span>📺 Inscrever-se no canal / Ação obrigatória</span>
                <span class="status-etapa">Pendente</span>
            </div>

            <button id="btnDesbloquear" class="btn-bloqueado" disabled onclick="irParaDestino()">
                Desbloquear Conteúdo
            </button>
        </div>
    </div>

    <script type="module" src="js/campanha.js"></script>
</body>
</html>
